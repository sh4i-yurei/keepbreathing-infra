# Runs on the control plane, from this directory.
[defaults]
inventory = inventory.ini
roles_path = roles
interpreter_python = auto_silent
host_key_checking = True
retry_files_enabled = False

[privilege_escalation]
# Production boxes escalate with a password (Control plane decision #8). The password
# comes from the vault per host, via the lookup in group_vars/all.yml; Packer builds
# set become=false and connect as root instead; see roles/baseline/defaults.

become = True

[ssh_connection]
# One approved Tailscale SSH check-mode connection is reused for the whole session,
# so the browser check happens once, not on every run.
ssh_args = -o ControlMaster=auto -o ControlPersist=30m
