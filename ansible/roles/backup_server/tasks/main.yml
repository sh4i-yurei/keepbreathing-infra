---
- name: Create and prepare the backup server account
  ansible.builtin.import_tasks: account.yml

- name: Backup server | Create the data directory
  ansible.builtin.file:
    path: "{{ backup_server_mount_point }}/restic"
    state: directory
    owner: "{{ backup_server_user }}"
    group: "{{ backup_server_user }}"
    mode: "0700"
  when: backup_server_account.uid is defined or not ansible_check_mode

- name: Backup server | Create the account's configuration directories
  ansible.builtin.file:
    path: "/home/{{ backup_server_user }}/{{ item }}"
    state: directory
    owner: "{{ backup_server_user }}"
    group: "{{ backup_server_user }}"
    mode: "0700"
  loop:
    - .config
    - .config/containers
    - .config/containers/systemd
    - .config/backup-server
  when: backup_server_account.uid is defined or not ansible_check_mode

- name: Backup server | Write the htpasswd file
  ansible.builtin.template:
    src: htpasswd.j2
    dest: "/home/{{ backup_server_user }}/.config/backup-server/htpasswd"
    owner: "{{ backup_server_user }}"
    group: "{{ backup_server_user }}"
    mode: "0600"
  no_log: true
  diff: false
  notify: Restart backup server
  when: backup_server_account.uid is defined or not ansible_check_mode

- name: Backup server | Write the fixed verification file
  ansible.builtin.copy:
    content: "backup server verification\n"
    dest: "/home/{{ backup_server_user }}/.config/backup-server/verify.txt"
    owner: "{{ backup_server_user }}"
    group: "{{ backup_server_user }}"
    mode: "0600"
  when: backup_server_account.uid is defined or not ansible_check_mode

- name: Backup server | Write the Quadlet file
  ansible.builtin.template:
    src: backup-server.container.j2
    dest: "/home/{{ backup_server_user }}/.config/containers/systemd/backup-server.container"
    owner: "{{ backup_server_user }}"
    group: "{{ backup_server_user }}"
    mode: "0644"
  notify:
    - Reload backup server user manager
    - Restart backup server
  when: backup_server_account.uid is defined or not ansible_check_mode

- name: Backup server | Pull rclone and restic into the account's storage
  containers.podman.podman_image:
    name: "{{ item }}"
  loop:
    - "{{ backup_server_image }}"
    - "{{ backup_server_restic_image }}"
  become: true
  become_user: "{{ backup_server_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ backup_server_account.uid }}"
  when: not ansible_check_mode

- name: Backup server | Apply service handlers before starting
  ansible.builtin.meta: flush_handlers

- name: Backup server | Start the service
  ansible.builtin.systemd_service:
    name: backup-server.service
    state: started
    scope: user
  become: true
  become_user: "{{ backup_server_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ backup_server_account.uid }}"
  when: not ansible_check_mode

- name: Verify the running backup server
  ansible.builtin.import_tasks: verify.yml
