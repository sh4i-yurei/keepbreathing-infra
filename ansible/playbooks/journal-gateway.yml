---
# Targets the hub and every gateway; --limit is required when more than one is reached.
# The limit has to include the hub, whose play below makes the
# client certificate every gateway trusts:
#   ansible-playbook playbooks/journal-gateway.yml --limit hub,web

- name: Fetch the become password
  hosts: hub:droplets:vaultserv
  gather_facts: false
  become: false
  roles: [become_password]

# The hub's client certificate must exist before a gateway can trust it.
- name: Prepare the journal pull client's certificate
  hosts: hub
  tasks:
    - name: Create the hub's journal client certificate
      ansible.builtin.import_role:
        name: hub
        tasks_from: journal-client-cert

- name: Journal gateways
  hosts: droplets:vaultserv
  force_handlers: true
  roles:
    - journal_gateway
