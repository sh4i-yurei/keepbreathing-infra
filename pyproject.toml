[tool.mutmut]
source_paths = ["ansible/filter_plugins", "ansible/roles/access/files", "ansible/roles/baseline/files", "ansible/roles/hub/files"]
also_copy = ["ansible/tests"]
cache_invalidation_files = ["ansible/tests/*.py"]
on_dependency_change = "rerun"
pytest_add_cli_args_test_selection = ["ansible/tests/test_durations.py", "ansible/tests/test_node_exporter_firewall.py", "ansible/tests/test_sudo_nopasswd_check.py", "ansible/tests/test_repo_gpgcheck_check.py", "ansible/tests/test_journal_pull.py", "ansible/tests/test_journal_pull_edges.py", "ansible/tests/test_journal_resume.py", "-k", "not test_gap_marker_imports_before_source_entry_with_almalinux_10"]

[tool.pytest.ini_options]
testpaths = ["ansible/tests"]

[tool.coverage.run]
patch = ["subprocess"]
