---
argument_specs:
  main:
    short_description: Manage what's inside OpenBao through its API, as the ansible login
    options:
      openbao_port:
        type: int
        required: true
      openbao_self_address:
        type: str
        required: true
      openbao_ansible_password:
        type: str
        required: true
        no_log: true
      openbao_approles:
        type: list
        elements: dict
        required: true
        options:
          name:
            type: str
            required: true
          account:
            type: str
          files:
            type: bool
            default: true
          extra_paths:
            type: list
            elements: dict
            default: []
            options:
              path:
                type: str
                required: true
              capabilities:
                type: list
                elements: str
                required: true
      openbao_approle_bound_cidrs:
        type: list
        elements: str
        required: true
      openbao_transit_keys:
        type: list
        elements: str
        default: []
      openbao_make_transit_keys:
        type: bool
        default: false
      openbao_jwt_roles:
        type: list
        elements: dict
        default: []
        options:
          name:
            type: str
            required: true
          bound_claims:
            type: dict
            required: true
          transit_keys:
            type: list
            elements: str
            required: true
          token_ttl:
            type: int
            default: 1800
          extra_paths:
            type: list
            elements: dict
            default: []
            options:
              path:
                type: str
                required: true
              capabilities:
                type: list
                elements: str
                required: true
      openbao_jwt_issuer:
        type: str
        default: https://token.actions.githubusercontent.com
      openbao_jwt_audience:
        type: str
        default: ""
