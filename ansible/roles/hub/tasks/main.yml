---
# The services that run on the hub, each one task file, in the order they are built.
# The account comes first so the role is complete when run on its own; in playbooks/hub.yml
# it has already run before baseline, and reports no change here.

- name: Create the container account
  ansible.builtin.import_tasks: account.yml

- name: Route the droplets' VPC through the tailnet, keeping the hub's own subnet direct
  ansible.builtin.import_tasks: tailnet-routes-setup.yml

- name: Check the hub's routing is in the state the role claims
  ansible.builtin.import_tasks: tailnet-routes-verify.yml

- name: Run ntfy
  ansible.builtin.import_tasks: ntfy-setup.yml

- name: Check ntfy is in the state the role claims
  ansible.builtin.import_tasks: ntfy-verify.yml

- name: Run Gatus
  ansible.builtin.import_tasks: gatus-setup.yml

- name: Check Gatus is in the state the role claims
  ansible.builtin.import_tasks: gatus-verify.yml

- name: Run Alertmanager
  ansible.builtin.import_tasks: alertmanager-setup.yml

- name: Check Alertmanager is in the state the role claims
  ansible.builtin.import_tasks: alertmanager-verify.yml

- name: Run Prometheus
  ansible.builtin.import_tasks: prometheus-setup.yml

- name: Check Prometheus is in the state the role claims
  ansible.builtin.import_tasks: prometheus-verify.yml
