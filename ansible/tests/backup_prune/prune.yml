---
- name: Test the backup prune role locally
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  vars:
    b2_buckets:
      - machine: testhost
        name: b2prune-locked
    backup_prune_user: bptest
    backup_prune_repository_root: "{{ lookup('ansible.builtin.env', 'TEST_MOUNT') }}/restic"
    backup_prune_restic_image: "{{ lookup('ansible.builtin.env', 'TEST_RESTIC_IMAGE') }}"
    backup_prune_lock_wait: 5s
    backup_prune_timeout: 60
  roles:
    - backup_prune
  tasks:
    - name: Deliberately fail after the role for driver cleanup proof
      ansible.builtin.fail:
        msg: Deliberate failure after backup prune
      when: lookup('ansible.builtin.env', 'TEST_FAIL_AFTER_PRUNE_ROLE') == '1'
