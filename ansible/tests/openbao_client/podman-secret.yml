---
- name: Exercise openbao_client's podman-secret entry point on localhost
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Create, replace or remake the account's Podman secret
      ansible.builtin.include_role:
        name: openbao_client
        tasks_from: podman-secret

    - name: Report whether the secret changed
      ansible.builtin.debug:
        var: openbao_client_secret_changed
