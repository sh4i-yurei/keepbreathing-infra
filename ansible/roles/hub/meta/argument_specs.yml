---
argument_specs:
  main:
    short_description: The services that run on the hub
    options:
      hub_backup_disk_device:
        type: path
        required: true
        description: The stable path to the hub's backup disk.
      hub_backup_mount_point:
        type: path
        default: /srv/backup
        description: The mount point for the hub's backup disk.
      hub_container_user:
        type: str
        required: true
        description: The account the hub's containers run under.
      hub_tailnet_domain:
        type: str
        default: tail4cf2f3.ts.net
        description: The tailnet's MagicDNS domain, which a Tailscale Service's hostname ends in.
      hub_site_domain:
        type: str
        default: keepbreath.ing
        description: The site's domain, which its web and mail hostnames end in.
      hub_ntfy_image:
        type: str
        default: docker.io/binwiederhier/ntfy@sha256:4c599cf0818965782f93f652bd843e92714992e84d6b88ad17713dc0951cda1f
        description: ntfy's container image, pinned by digest.
      hub_ntfy_version:
        type: str
        default: "2.29.0"
        description: ntfy's version, matching the digest in hub_ntfy_image.
      hub_ntfy_alertmanager_template_from:
        type: str
        default: "2.29.0"
        description: The ntfy version files/ntfy-alertmanager-page.yml was copied from.
      hub_ntfy_port:
        type: int
        default: 8080
        description: The port ntfy is published on, on 127.0.0.1 only.
      hub_ntfy_metrics_port:
        type: int
        default: 9095
        description: The port ntfy's metrics are published on, on 127.0.0.1 only.
      hub_ntfy_users:
        type: list
        elements: dict
        description: ntfy's users. Each has a name, a list of topic:access rules, and token
          true for the ones that publish with a token.

      hub_gatus_image:
        type: str
        default: ghcr.io/twin/gatus@sha256:094eb186e55235db367e90e9d56140e5897b7044c41de23cde4cc18e6da1242e
        description: Gatus's container image, pinned by digest.
      hub_gatus_port:
        type: int
        default: 8081
        description: The port Gatus is published on, on 127.0.0.1 only.

      hub_prometheus_image:
        type: str
        default: quay.io/prometheus/prometheus@sha256:87861b8cf91579109319ebc300f3f1060e6da9c05d6ae8ad15a20c879e84e32e
        description: Prometheus's container image, pinned by digest.
      hub_prometheus_port:
        type: int
        default: 9090
        description: The port Prometheus is published on, on 127.0.0.1 only.
      hub_host_loopback:
        type: str
        default: 169.254.1.3
        description: The address in Prometheus's and Alertmanager's containers that reaches the hub's loopback.

      hub_alertmanager_image:
        type: str
        default: quay.io/prometheus/alertmanager@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
        description: Alertmanager's container image, pinned by digest.
      hub_alertmanager_port:
        type: int
        default: 9093
        description: The port Alertmanager is published on, on 127.0.0.1 only.
      hub_ticket_receiver_password:
        type: str
        required: true
        no_log: true
        description: Alertmanager's password for the ticket band's receiver, written into Alertmanager's ticket-receiver-password file.
      hub_ticket_receiver_port:
        type: int
        required: true
        description: The hub role's copy of ticket_band_receiver_port, the port Prometheus scrapes the ticket band's receiver on through nginx.

      hub_node_exporter_tailnet_hosts:
        type: list
        elements: dict
        description: Machines whose node_exporter the hub scrapes over the tailnet with a password.
        options:
          name:
            type: str
            required: true
          address:
            type: str
            required: true

      hub_podman_exporter_image:
        type: str
        default: quay.io/navidys/prometheus-podman-exporter@sha256:ddaa9003e86f435f2d958ab68041959e4d2bb290a350a2649a123c449db032db
        description: The Podman exporter's container image, pinned by digest.
      hub_podman_exporter_port:
        type: int
        default: 9882
        description: The port the Podman exporter is published on, on 127.0.0.1 only.
      hub_podman_exporter_droplet_hosts:
        type: list
        elements: str
        default: [web, control]
        description: Droplets whose Podman exporters Prometheus scrapes over HTTPS.
      hub_podman_exporter_tailnet_hosts:
        type: list
        elements: str
        default: [vaultserv]
        description: Machines whose Podman exporters Prometheus scrapes over the tailnet.
      hub_podman_exporter_hosts:
        type: list
        elements: str
        description: Every non-hub machine with a Podman exporter.

      hub_grafana_image:
        type: str
        default: docker.io/grafana/grafana@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
        description: Grafana's container image, pinned by digest.
      hub_grafana_version:
        type: str
        default: "13.2.4"
        description: The Grafana version the pinned image runs, which the verify checks.
      hub_grafana_port:
        type: int
        default: 3000
        description: The port Grafana is published on, on 127.0.0.1 only.
      hub_journal_sources:
        type: list
        elements: dict
        description: Remote journal gateways the hub pulls from.
        options:
          name:
            type: str
            required: true
          address:
            type: str
            required: true
      hub_loki_image:
        type: str
        default: docker.io/grafana/loki@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
        description: Loki 3.7.8 image pinned by digest.
      hub_loki_port:
        type: int
        default: 3100
        description: Loopback port for Loki.
      hub_alloy_image:
        type: str
        default: docker.io/grafana/alloy@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
        description: Alloy 1.20.1 image pinned by digest.
      hub_journal_probe_image:
        type: str
        default: docker.io/library/almalinux@sha256:838c2fafefb1a8a0d7f8cdbc3b0551c2a2b1eb0cd87aad6d62aecadb18311f1b
        description: AlmaLinux 10.2 image with journalctl for the rootless journal read probe.
      hub_grafana_plugins:
        type: list
        elements: dict
        description: Grafana's plugins, each with its id, version and the SHA-256 of its linux-amd64 zip.
        options:
          id:
            type: str
            required: true
          version:
            type: str
            required: true
          sha256:
            type: str
            required: true

  backup-disk-setup:
    short_description: Create and mount the hub's backup disk
    options:
      hub_backup_disk_device:
        type: path
        required: true
        description: The path to the backup disk.
      hub_backup_mount_point:
        type: path
        default: /srv/backup
        description: The mount point for the backup disk.

  backup-disk-verify:
    short_description: Verify the hub's backup disk mount
    options:
      hub_backup_disk_device:
        type: path
        required: true
        description: The path to the backup disk.
      hub_backup_mount_point:
        type: path
        default: /srv/backup
        description: The mount point for the backup disk.

  account:
    short_description: Create the account the hub's containers run under
    options:
      hub_container_user:
        type: str
        required: true
        description: The account the hub's containers run under.
