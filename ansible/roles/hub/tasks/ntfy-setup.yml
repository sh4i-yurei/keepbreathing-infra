---
# Notification service step 3. ntfy as a rootless Quadlet container under the hub's
# container account. Files are written as root and owned by that account (Ansible decision
# #50); only the systemd and Podman tasks run as the account itself.

- name: ntfy-setup | Stop if ntfy changed version without its Alertmanager template being checked
  ansible.builtin.assert:
    that:
      - hub_ntfy_version == hub_ntfy_alertmanager_template_from
    fail_msg: >-
      ntfy is now {{ hub_ntfy_version }}, but files/ntfy-alertmanager-page.yml was copied from
      ntfy {{ hub_ntfy_alertmanager_template_from }}. Compare it with ntfy's built-in
      server/templates/alertmanager.yml at v{{ hub_ntfy_version }}, update the copy, then set
      hub_ntfy_alertmanager_template_from to {{ hub_ntfy_version }} (Monitoring and alerting #27).
    quiet: true

- name: ntfy-setup | Create the folders ntfy and its Quadlet file live in
  ansible.builtin.file:
    path: "/home/{{ hub_container_user }}/{{ item }}"
    state: directory
    owner: "{{ hub_container_user }}"
    group: "{{ hub_container_user }}"
    mode: "0700"
  loop:
    - .config
    - .config/containers
    - .config/containers/systemd
    - .config/ntfy
    - .config/ntfy/templates
    - ntfy

- name: ntfy-setup | Write ntfy's configuration file
  ansible.builtin.template:
    src: ntfy-server.yml.j2
    dest: "/home/{{ hub_container_user }}/.config/ntfy/server.yml"
    owner: "{{ hub_container_user }}"
    group: "{{ hub_container_user }}"
    mode: "0600"
  diff: false
  no_log: true
  notify: Restart ntfy

- name: ntfy-setup | Write ntfy's Alertmanager template
  ansible.builtin.copy:
    src: ntfy-alertmanager-page.yml
    dest: "/home/{{ hub_container_user }}/.config/ntfy/templates/alertmanager-page.yml"
    owner: "{{ hub_container_user }}"
    group: "{{ hub_container_user }}"
    mode: "0600"
  notify: Restart ntfy

- name: ntfy-setup | Write ntfy's Quadlet file
  ansible.builtin.template:
    src: ntfy.container.j2
    dest: "/home/{{ hub_container_user }}/.config/containers/systemd/ntfy.container"
    owner: "{{ hub_container_user }}"
    group: "{{ hub_container_user }}"
    mode: "0644"
  notify:
    - Reload systemd for the container account
    - Restart ntfy

- name: ntfy-setup | Download ntfy's image into the container account's storage
  containers.podman.podman_image:
    name: "{{ hub_ntfy_image }}"
  become: true
  become_user: "{{ hub_container_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ hub_container_account.uid }}"

- name: ntfy-setup | Run the handlers before making sure ntfy is running
  ansible.builtin.meta: flush_handlers

- name: ntfy-setup | Make sure ntfy is running
  ansible.builtin.systemd_service:
    name: ntfy.service
    state: started
    scope: user
  become: true
  become_user: "{{ hub_container_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ hub_container_account.uid }}"

- name: ntfy-setup | Read the hub's Tailscale serve state
  ansible.builtin.command: tailscale serve status --json
  register: hub_ntfy_serve_status
  changed_when: false
  check_mode: false

# Notification service decision #19. A serve settings file cannot express HTTPS on 443 in
# front of plain HTTP to ntfy, so the role runs the serve command itself, and only when the
# hub is not already serving it that way. Clearing first replaces any other setting on 443.
- name: ntfy-setup | Serve ntfy as the Tailscale Service when the hub is not already doing so
  ansible.builtin.shell: >-
    tailscale serve clear svc:ntfy &&
    tailscale serve --yes --service=svc:ntfy --https=443 127.0.0.1:{{ hub_ntfy_port }}
  vars:
    hub_ntfy_serve: "{{ (hub_ntfy_serve_status.stdout | from_json).Services['svc:ntfy'] | default({}) }}"
  when: >-
    not (hub_ntfy_serve.TCP['443'].HTTPS | default(false))
    or (hub_ntfy_serve.Web['ntfy.tail4cf2f3.ts.net:443'].Handlers['/'].Proxy | default(''))
    != 'http://127.0.0.1:' ~ hub_ntfy_port
  changed_when: true
