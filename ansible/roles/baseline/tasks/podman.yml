---
# Bootstrap step 9. Podman for rootless containers, on every machine.
# net.ipv4.ip_unprivileged_port_start is not set here (decision #22). It lets every
# unprivileged account on the machine bind ports 80 to 1023, so it is set by the role
# for machines that serve those ports.

- name: podman | Ensure podman is installed
  ansible.builtin.dnf:
    name: podman
    state: present

# Two halves of one mechanism, and both are needed. Quadlet orders every rootless
# container behind a helper that waits for network-online.target. The symlink pulls that
# target into the boot sequence; the wait-online service is what makes waiting for it mean
# anything.
#
# Without the service the target still activates, and almost immediately: it has an empty
# Requires= and only a Wants= on NetworkManager-wait-online, so with that disabled there is
# nothing to wait for. The helper sees it active on its first poll and containers start on
# time, with no guarantee the network is up. The ninety seconds is the helper's
# TimeoutStartSec, and it only applies when the target never activates at all.
#
# The trade: boot now waits on the network where it previously did not. The shipped unit
# runs nm-online with NM_ONLINE_TIMEOUT=60, so a machine with a configured interface that
# never gets carrier stalls a minute on every boot; `systemctl edit
# NetworkManager-wait-online` changes that.
#
# Checked 2026-09-19: enabled on every machine in the inventory, so this task is a no-op
# today. On AlmaLinux 10 the distribution's 90-default.preset (from almalinux-release)
# enables it; on AlmaLinux 9 no preset names it and it arrived enabled with the image. It
# exists so a machine where someone disabled it does not silently lose the guarantee.
#
# It also hard-fails on a machine with no NetworkManager — systemd_service cannot enable a
# unit that does not exist. Accepted: every machine here uses NetworkManager, and a box
# that does not would need this step reconsidered rather than skipped.

- name: podman | Make network-online.target active at boot
  ansible.builtin.file:
    state: link
    src: /usr/lib/systemd/system/network-online.target
    dest: /etc/systemd/system/multi-user.target.wants/network-online.target

- name: podman | Enable the service that makes network-online.target reach active
  ansible.builtin.systemd_service:
    name: NetworkManager-wait-online.service
    enabled: true

- name: podman | Prepare the container account
  ansible.builtin.import_tasks: container-account.yml
