---
argument_specs:
  main:
    short_description: The services that run on the hub
    options:
      hub_container_user:
        type: str
        required: true
        description: The account the hub's containers run under.
      hub_tailnet_domain:
        type: str
        default: tail4cf2f3.ts.net
        description: The tailnet's MagicDNS domain, which a Tailscale Service's hostname ends in.
      hub_ntfy_image:
        type: str
        default: docker.io/binwiederhier/ntfy@sha256:4c599cf0818965782f93f652bd843e92714992e84d6b88ad17713dc0951cda1f
        description: ntfy's container image, pinned by digest.
      hub_ntfy_version:
        type: str
        default: "2.29.0"
        description: ntfy's version, matching the digest in hub_ntfy_image.
      hub_ntfy_alertmanager_template_from:
        type: str
        default: "2.29.0"
        description: The ntfy version files/ntfy-alertmanager-page.yml was copied from.
      hub_ntfy_port:
        type: int
        default: 8080
        description: The port ntfy is published on, on 127.0.0.1 only.
      hub_ntfy_users:
        type: list
        elements: dict
        description: ntfy's users. Each has a name, a list of topic:access rules, and token
          true for the ones that publish with a token.

      hub_gatus_image:
        type: str
        default: ghcr.io/twin/gatus@sha256:094eb186e55235db367e90e9d56140e5897b7044c41de23cde4cc18e6da1242e
        description: Gatus's container image, pinned by digest.
      hub_gatus_port:
        type: int
        default: 8081
        description: The port Gatus is published on, on 127.0.0.1 only.

      hub_prometheus_image:
        type: str
        default: quay.io/prometheus/prometheus@sha256:87861b8cf91579109319ebc300f3f1060e6da9c05d6ae8ad15a20c879e84e32e
        description: Prometheus's container image, pinned by digest.
      hub_prometheus_port:
        type: int
        default: 9090
        description: The port Prometheus is published on, on 127.0.0.1 only.
      hub_host_loopback:
        type: str
        default: 169.254.1.3
        description: The address in Prometheus's container that reaches the hub's loopback.

      hub_alertmanager_image:
        type: str
        default: quay.io/prometheus/alertmanager@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
        description: Alertmanager's container image, pinned by digest.
      hub_alertmanager_port:
        type: int
        default: 9093
        description: The port Alertmanager is published on, on 127.0.0.1 only.

  account:
    short_description: Create the account the hub's containers run under
    options:
      hub_container_user:
        type: str
        required: true
        description: The account the hub's containers run under.
