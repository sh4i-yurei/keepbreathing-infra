---
- name: backup-disk-setup | Create XFS only on a disk with no filesystem
  community.general.filesystem:
    dev: "{{ hub_backup_disk_device }}"
    fstype: xfs
    force: false
  become: true

- name: backup-disk-setup | Mount the backup disk without blocking boot if it is absent
  ansible.posix.mount:
    path: "{{ hub_backup_mount_point }}"
    src: "{{ hub_backup_disk_device }}"
    fstype: xfs
    opts: defaults,nofail
    state: mounted
  become: true
