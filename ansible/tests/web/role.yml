---
- name: Exercise the web account and checkouts on localhost
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Create the web account before baseline
      ansible.builtin.import_role:
        name: web
        tasks_from: account

    - name: Start the web container account
      ansible.builtin.import_role:
        name: baseline
        tasks_from: container-account
      vars:
        baseline_container_user: "{{ web_container_user }}"
      when: not ansible_check_mode

    - name: Apply the web role
      ansible.builtin.import_role:
        name: web
