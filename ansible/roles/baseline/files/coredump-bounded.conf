# Managed by Ansible (roles/baseline). Edits here are overwritten.
# Read by systemd-coredump, which the kernel runs for each crashing process. Without
# this file it keeps dumps under 10% of the disk and leaves 15% free. Storage stays
# external, the default, so a dump is written to /var/lib/systemd/coredump/ and can be
# read back with coredumpctl. Each dump is at most 1G (ProcessSizeMax in the stock file).
[Coredump]
# Total disk core dumps may occupy; the oldest are deleted past this.
MaxUse=1G
# Disk space that must remain free; a dump that would go below this is not written.
KeepFree=2G
