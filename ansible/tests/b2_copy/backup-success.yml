---
- name: Install the backup success writer for B2 copy tests
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  tasks:
    - name: Install the writer with a scratch textfile folder
      ansible.builtin.import_role:
        name: node_exporter
        tasks_from: backup-success
      vars:
        node_exporter_textfile_directory: "{{ lookup('ansible.builtin.env', 'TEST_TEXTFILE') }}"
