---
- name: Reload systemd for podman_exporter
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ podman_exporter_container_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[podman_exporter_container_user][1] }}"
  when: not ansible_check_mode

- name: Restart podman_exporter
  ansible.builtin.systemd_service:
    name: podman-exporter.service
    state: restarted
    scope: user
  become: true
  become_user: "{{ podman_exporter_container_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[podman_exporter_container_user][1] }}"
  when: not ansible_check_mode
