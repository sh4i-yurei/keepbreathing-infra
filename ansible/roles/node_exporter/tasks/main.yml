---
# Installs node_exporter's release binary, checked against the pinned SHA-256, and runs it
# under systemd as its own account (Monitoring and alerting decisions #12, #24 and #25).

- name: Create the account it runs as
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /sbin/nologin
    create_home: false
  become: true

# AlmaLinux 9 and 10 package the DNF needs-restarting plugin as yum-utils. There is no
# dnf-utils package in their repositories (checked on the hub on 2026-10-18).
- name: Install the package that provides needs-restarting
  ansible.builtin.dnf:
    name: yum-utils
    state: present
  become: true

- name: Make the textfile collector directory
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_directory }}"
    state: directory
    owner: root
    group: node_exporter
    mode: "0750"
  become: true

- name: Install the atomic reboot-required metric writer
  ansible.builtin.template:
    src: node-exporter-reboot-required
    dest: /usr/local/libexec/node-exporter-reboot-required
    owner: root
    group: root
    mode: "0755"
  become: true
  notify: Run node_exporter reboot-required check

- name: Install the reboot-required service
  ansible.builtin.template:
    src: node-exporter-reboot-required.service.j2
    dest: /etc/systemd/system/node-exporter-reboot-required.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd for node_exporter
    - Run node_exporter reboot-required check

- name: Install the reboot-required timer
  ansible.builtin.template:
    src: node-exporter-reboot-required.timer.j2
    dest: /etc/systemd/system/node-exporter-reboot-required.timer
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd for node_exporter
    - Restart node_exporter reboot-required timer

- name: Make the folder the release is kept in
  ansible.builtin.file:
    path: /var/cache/node_exporter
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Download the release and check it against the pinned SHA-256
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/{{ node_exporter_release }}.tar.gz"
    dest: "/var/cache/node_exporter/{{ node_exporter_release }}.tar.gz"
    checksum: "sha256:{{ node_exporter_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Unpack the release
  ansible.builtin.unarchive:
    src: "/var/cache/node_exporter/{{ node_exporter_release }}.tar.gz"
    dest: /var/cache/node_exporter
    remote_src: true
    creates: "/var/cache/node_exporter/{{ node_exporter_release }}/node_exporter"
  become: true

- name: Install the binary
  ansible.builtin.copy:
    src: "/var/cache/node_exporter/{{ node_exporter_release }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  become: true
  notify: Restart node_exporter

- name: Write the web config, and the key and certificate for HTTPS
  ansible.builtin.import_tasks: web-config.yml
  when: node_exporter_web_config | bool

- name: Write the systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd for node_exporter
    - Restart node_exporter

# Every interface on the droplets is in the public zone, and control's tailscale0, in no zone,
# falls into the default zone, also public (read on all three on 2026-10-14).
- name: Let the scrape addresses reach its port through firewalld
  ansible.posix.firewalld:
    rich_rule: 'rule family="ipv4" source address="{{ item }}" port port="{{ node_exporter_listen_address.split(":")[-1] }}" protocol="tcp" accept'
    zone: public
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ node_exporter_allowed_sources }}"
  become: true

- name: Read the permanent rich rules after adding the current sources
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --zone=public
      - --list-rich-rules
  register: node_exporter_permanent_rich_rules
  changed_when: false
  check_mode: false

- name: Plan removal of obsolete node_exporter rich rules
  ansible.builtin.set_fact:
    node_exporter_firewall_plan: >-
      {{ node_exporter_permanent_rich_rules.stdout_lines
         | node_exporter_firewall_plan(
             node_exporter_listen_address.split(':')[-1],
             node_exporter_allowed_sources
           ) }}

- name: Remove obsolete node_exporter rich rules
  ansible.posix.firewalld:
    rich_rule: "{{ item }}"
    zone: public
    permanent: true
    immediate: true
    state: disabled
  loop: "{{ node_exporter_firewall_plan.stale_rules }}"
  loop_control:
    label: "{{ item }}"
  become: true

- name: Run the handlers before making sure it is running
  ansible.builtin.meta: flush_handlers

- name: Write the first reboot-required metric when it is absent
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/node-exporter-reboot-required
    creates: "{{ node_exporter_textfile_directory }}/reboot-required.prom"
  become: true

- name: Check for a needed reboot every hour
  ansible.builtin.systemd_service:
    name: node-exporter-reboot-required.timer
    state: started
    enabled: true
  become: true
  when: not ansible_check_mode

- name: Make sure it is running and starts at boot
  ansible.builtin.systemd_service:
    name: node_exporter.service
    state: started
    enabled: true
  become: true

- name: Check it is in the state the role claims
  ansible.builtin.import_tasks: verify.yml
