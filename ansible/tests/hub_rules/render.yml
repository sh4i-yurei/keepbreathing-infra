---
- name: Render the hub's container-missing alert rule locally
  hosts: hub
  connection: local
  gather_facts: false
  vars:
    ansible_become: false
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    role_path: "{{ playbook_dir }}/../../roles/hub" # noqa: var-naming[read-only] - supplied for the role vars outside a role
  vars_files:
    - ../../roles/hub/defaults/main.yml
    - ../../roles/hub/vars/main.yml
  tasks:
    - name: Render container-missing rules
      ansible.builtin.template:
        src: "{{ role_path }}/templates/container-missing-rules.yml.j2"
        dest: "{{ hub_rules_output }}"
        mode: "0644"
