---
# Handlers run once, after the tasks that notify them, in the order they are DEFINED here.
# Restart the user manager first when its groups change. Later Quadlet handlers
# reload that manager before restarting a changed service.

- name: Restart the container account's user manager
  ansible.builtin.systemd_service:
    name: "user@{{ hub_container_account.uid }}.service"
    state: restarted
  become: true
  when: not ansible_check_mode

- name: Reload systemd for the container account
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ hub_container_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ hub_container_account.uid }}"

- name: Restart ntfy
  ansible.builtin.systemd_service:
    name: ntfy.service
    state: restarted
    scope: user
  become: true
  become_user: "{{ hub_container_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ hub_container_account.uid }}"

