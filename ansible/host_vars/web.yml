---
# Runs the site's nginx and the contact API as rootless containers.
baseline_container_user: keepbreath1

# Not on the tailnet. Reached only through the jump server, which is the control plane at
# its public address — the same path as the ProxyJump entry for web in ~/.ssh/config.
# Declared here rather than in ansible.cfg's ssh_args so it applies to this host alone and
# not to the three machines that are reached directly over the tailnet.
# IdentitiesOnly restricts ssh to the default identity files rather than offering every
# key the agent holds. It makes no difference when the first key works, which it does
# here; it matters when one does not, because each extra offer is another failed
# authentication for a fail2ban jail to count.
ansible_ssh_common_args: -o ProxyJump=keepbreath0@129.212.184.103 -o IdentitiesOnly=yes

# node_exporter listens on the VPC address. Scrapes from the hub arrive through control, whose VPC
# address is 10.128.0.5, and only that address may reach it (decisions #19 and #32).
node_exporter_listen_address: "10.128.0.3:9100"
node_exporter_allowed_sources:
  - 10.128.0.5

podman_exporter_enabled: true
podman_exporter_container_user: "{{ baseline_container_user }}"
podman_exporter_listen_address: "10.128.0.3:9882"
podman_exporter_allowed_sources: "{{ node_exporter_allowed_sources }}"
podman_exporter_expected_containers:
  - contact-api
  - contact-worker
  - keepbreath
  - keepbreath-redis
  - podman-exporter
