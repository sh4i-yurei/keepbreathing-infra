---
# The hub pulls each droplet's export nightly through a forced-command account (Backups decisions 64 to 66).
- name: Fetch the become password
  hosts: hub:webservers
  gather_facts: false
  become: false
  roles: [become_password]

- name: Make the hub's pull key before any droplet changes
  hosts: hub
  gather_facts: false
  tasks:
    - name: Make or read the hub's pull key
      ansible.builtin.include_role:
        name: hub_pull
        tasks_from: key

- name: Give each web droplet its forced-command export account
  hosts: webservers
  gather_facts: false
  roles:
    - role: hub_export
      vars:
        hub_export_hub_key: "{{ hostvars['hub'].hub_pull_public_key }}"

- name: Read each web droplet's own host key for the hub to pin
  hosts: webservers
  gather_facts: false
  become: true
  tasks:
    - name: Read the droplet's ed25519 host key
      ansible.builtin.slurp:
        src: /etc/ssh/ssh_host_ed25519_key.pub
      register: hub_export_host_key_file

    - name: Keep the key's type and value for the hub
      ansible.builtin.set_fact:
        hub_export_host_key: "{{ (hub_export_host_key_file.content | b64decode).split()[:2] | join(' ') }}"

- name: Install the hub's nightly pulls
  hosts: hub
  force_handlers: true
  roles:
    - hub_pull
