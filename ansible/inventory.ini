# Ansible runs from the laptop for now. The two VMs in the house and the control plane
# are reached over the tailnet, where Tailscale SSH does the authentication. web and
# mail only have VPC addresses and are out of reach until Ansible moves to the control plane.

[webservers]
web ansible_host=10.128.0.3

[mailservers]
mail ansible_host=10.128.0.4

[controlplane]
control ansible_host=100.91.226.31

[monitoring]
hub ansible_host=100.95.89.6

[passwordvault]
vaultserv ansible_host=100.65.221.62


[droplets:children]
webservers
mailservers
controlplane

[vms:children]
monitoring
passwordvault


[all:vars]
ansible_user=keepbreath0
