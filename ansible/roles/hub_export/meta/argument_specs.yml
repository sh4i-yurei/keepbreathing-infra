---
argument_specs:
  main:
    short_description: Give a droplet the forced-command account the hub pulls its export through
    options:
      hub_export_kind:
        type: str
        choices: [redis, tar]
      hub_export_container_user:
        type: str
        description: The redis kind's container account; the role requires it for that kind.
      hub_export_container:
        type: str
        description: The redis kind's container; the role requires it for that kind.
      hub_export_tar_paths:
        type: list
        elements: str
        description: The tar kind's paths, relative to /; the role requires them for that kind.
      hub_export_from:
        type: str
        required: true
      hub_export_hub_key:
        type: str
        required: true
