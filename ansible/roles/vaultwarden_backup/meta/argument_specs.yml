---
argument_specs:
  main:
    short_description: Back up and verify the local Vaultwarden instance
    options:
      vaultwarden_backup_user:
        type: str
        required: true
      vaultwarden_backup_data_dir:
        type: path
        required: true
      vaultwarden_backup_quadlet:
        type: path
        required: true
      vaultwarden_backup_container:
        type: str
        required: true
      vaultwarden_backup_repository:
        type: str
        required: true
      vaultwarden_backup_login:
        type: str
        required: true
      vaultwarden_backup_password:
        type: str
        required: true
        no_log: true
      vaultwarden_backup_restic_password:
        type: str
        required: true
        no_log: true
