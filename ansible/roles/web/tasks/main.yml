---
- name: Require a URL-safe Redis password
  ansible.builtin.assert:
    that: web_redis_password is match('^[A-Za-z0-9._~-]+\Z')
    quiet: true
    fail_msg: >-
      web: web_redis_password may hold only A-Z, a-z, 0-9 and . _ ~ -, because it goes
      into the broker URL unencoded (Ansible configuration management decision 69.4)

- name: Find the web container account
  ansible.builtin.getent:
    database: passwd
    key: "{{ web_container_user }}"
    fail_key: false

- name: Require the account before a real run
  ansible.builtin.fail:
    msg: "web: the account {{ web_container_user }} does not exist; run the web role's account entry point before baseline"
  when:
    - not ansible_check_mode
    - ansible_facts.getent_passwd.get(web_container_user) is none

- name: Install git
  ansible.builtin.package:
    name: git
    state: present
  become: true
  when: ansible_facts.getent_passwd.get(web_container_user) is not none

- name: Read checkout paths
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ web_checkouts }}"
  register: web_checkout_paths
  become: true
  when: ansible_facts.getent_passwd.get(web_container_user) is not none

- name: Read checkout git directories
  ansible.builtin.stat:
    path: "{{ item.path }}/.git"
  loop: "{{ web_checkouts }}"
  register: web_checkout_git
  become: true
  when: ansible_facts.getent_passwd.get(web_container_user) is not none

- name: Refuse a path that is not a git checkout
  ansible.builtin.fail:
    msg: "web: {{ item.0.item.path }} exists but is not a git checkout; move it aside before running the web role"
  loop: "{{ web_checkout_paths.results | zip(web_checkout_git.results) | list }}"
  when:
    - ansible_facts.getent_passwd.get(web_container_user) is not none
    - item.0.stat.exists
    - not item.1.stat.exists

- name: Make missing checkout directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ web_container_user }}"
    group: "{{ web_container_user }}"
    mode: "0755"
  loop: "{{ web_checkouts }}"
  loop_control:
    index_var: web_index
  become: true
  when:
    - ansible_facts.getent_passwd.get(web_container_user) is not none
    - not web_checkout_git.results[web_index].stat.exists

- name: Predict each clone
  ansible.builtin.debug:
    msg: "Would clone {{ item.repo }} at {{ item.ref }} into {{ item.path }}"
  loop: "{{ web_checkouts }}"
  loop_control:
    index_var: web_index
  changed_when: true
  when:
    - ansible_check_mode
    - ansible_facts.getent_passwd.get(web_container_user) is not none
    - not web_checkout_git.results[web_index].stat.exists

- name: Clone missing checkouts as the container account
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ item.path }}"
    version: "{{ item.ref }}"
    update: false
  loop: "{{ web_checkouts }}"
  loop_control:
    index_var: web_index
  become: true
  become_user: "{{ web_container_user }}"
  when:
    - not ansible_check_mode
    - ansible_facts.getent_passwd.get(web_container_user) is not none
    - not web_checkout_git.results[web_index].stat.exists

- name: Read the site's container unit
  ansible.builtin.slurp:
    src: /srv/keepbreathing/deploy/quadlet/keepbreath.container
  register: web_site_unit
  become: true
  when:
    - ansible_facts.getent_passwd.get(web_container_user) is not none
    - not ansible_check_mode or web_checkout_git.results[0].stat.exists

- name: Require the site's loopback server
  ansible.builtin.assert:
    that: "'PublishPort=127.0.0.1:8080:8080' in (web_site_unit.content | b64decode).splitlines()"
    fail_msg: >-
      web: the site checkout /srv/keepbreathing does not publish 127.0.0.1:8080
      (no line PublishPort=127.0.0.1:8080:8080 in deploy/quadlet/keepbreath.container);
      deploy keepbreathing #39, the loopback server, first
      (Ansible configuration management decision 61.9)
  when:
    - ansible_facts.getent_passwd.get(web_container_user) is not none
    - not ansible_check_mode or web_checkout_git.results[0].stat.exists

- name: Read checkout ownership for verification
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ web_checkouts }}"
  register: web_verify_paths
  become: true
  when:
    - ansible_facts.getent_passwd.get(web_container_user) is not none
    - not ansible_check_mode or web_checkout_git.results[0].stat.exists

- name: Verify checkout ownership
  ansible.builtin.assert:
    that: "item.stat.pw_name == web_container_user and item.stat.gr_name == web_container_user"
    fail_msg: "web: {{ item.item.path }} is not owned by {{ web_container_user }}"
  loop: "{{ web_verify_paths.results }}"
  when:
    - ansible_facts.getent_passwd.get(web_container_user) is not none
    - not ansible_check_mode or web_checkout_git.results[0].stat.exists

- name: Read checkout HEADs as the container account
  ansible.builtin.command:
    argv:
      - git
      - rev-parse
      - HEAD
    chdir: "{{ item.path }}"
  loop: "{{ web_checkouts }}"
  register: web_verify_heads
  changed_when: false
  check_mode: false
  become: true
  become_user: "{{ web_container_user }}"
  when:
    - ansible_facts.getent_passwd.get(web_container_user) is not none
    - not ansible_check_mode or web_checkout_git.results[0].stat.exists

- name: Read the network
  ansible.builtin.command:
    argv: [podman, network, inspect, keepbreath-net]
  register: web_network
  check_mode: false
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ web_container_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[web_container_user][1] }}"
  when: ansible_facts.getent_passwd.get(web_container_user) is not none

- name: Refuse a network Podman can't read
  ansible.builtin.fail:
    msg: >-
      web: podman network inspect keepbreath-net failed in a way that isn't
      'network not found', so the role won't create or change the network;
      fix Podman first: {{ web_network.stderr }}
  become: true
  become_user: "{{ web_container_user }}"
  when:
    - ansible_facts.getent_passwd.get(web_container_user) is not none
    - >-
      web_network.rc != 0 and not
      (web_network.rc == 125 and
       (web_network.stderr | trim).endswith('network not found') and
       'Error reading network config file' not in web_network.stderr)

- name: Require the network's settings
  ansible.builtin.assert:
    that:
      - "((web_network.stdout | from_json | first).subnets | map(attribute='subnet') | list) == ['10.89.0.0/24']"
      - "((web_network.stdout | from_json | first).subnets | map(attribute='gateway') | list) == ['10.89.0.1']"
      - "(web_network.stdout | from_json | first).dns_enabled == true"
    fail_msg: >-
      web: keepbreath-net exists with other settings; the role never changes
      an existing network, so fix it by hand
      (Ansible configuration management decision 61.4)
  become: true
  become_user: "{{ web_container_user }}"
  when:
    - ansible_facts.getent_passwd.get(web_container_user) is not none
    - web_network.rc == 0

- name: Predict the network's creation
  ansible.builtin.debug:
    msg: Would create keepbreath-net
  changed_when: true
  become: true
  become_user: "{{ web_container_user }}"
  when:
    - ansible_facts.getent_passwd.get(web_container_user) is not none
    - ansible_check_mode
    - web_network.rc == 125

- name: Create the network
  ansible.builtin.command:
    argv: [podman, network, create, --subnet, 10.89.0.0/24, --gateway, 10.89.0.1, keepbreath-net]
  changed_when: true
  become: true
  become_user: "{{ web_container_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[web_container_user][1] }}"
  when:
    - ansible_facts.getent_passwd.get(web_container_user) is not none
    - not ansible_check_mode
    - web_network.rc == 125

- name: Make the account's Quadlet folder
  ansible.builtin.file:
    path: "{{ ansible_facts.getent_passwd[web_container_user][4] }}/.config/containers/systemd"
    state: directory
    mode: "0700"
  become: true
  become_user: "{{ web_container_user }}"
  when: ansible_facts.getent_passwd.get(web_container_user) is not none

- name: Make the worker's drop-in folder
  ansible.builtin.file:
    path: "{{ ansible_facts.getent_passwd[web_container_user][4] }}/.config/containers/systemd/contact-worker.container.d"
    state: directory
    mode: "0755"
  become: true
  become_user: "{{ web_container_user }}"
  when: ansible_facts.getent_passwd.get(web_container_user) is not none

- name: Write the worker's relay drop-in
  ansible.builtin.copy:
    dest: "{{ ansible_facts.getent_passwd[web_container_user][4] }}/.config/containers/systemd/contact-worker.container.d/50-relay.conf"
    content: |
      [Container]
      Environment=CONTACT_SMTP_HOST={{ web_smtp_host }}
      Environment=CONTACT_SMTP_PORT={{ web_smtp_port }}
      Environment=CONTACT_SMTP_USER={{ web_smtp_user }}
      {% if web_smtp_host_address != '' %}AddHost={{ web_smtp_host }}:{{ web_smtp_host_address }}
      {% endif %}
    mode: "0644"
  register: web_relay_dropin
  become: true
  become_user: "{{ web_container_user }}"
  when: ansible_facts.getent_passwd.get(web_container_user) is not none

- name: Find which secrets exist
  ansible.builtin.command:
    argv: [podman, secret, exists, "{{ item }}"]
  loop: "{{ web_secrets | list }}"
  register: web_secret_exists
  check_mode: false
  changed_when: false
  failed_when: web_secret_exists.rc not in [0, 1]
  become: true
  become_user: "{{ web_container_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[web_container_user][1] }}"
  when: ansible_facts.getent_passwd.get(web_container_user) is not none

- name: Hash each stored secret
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      podman secret inspect --showsecret {{ item.item | quote }}
      | python3 -c 'import hashlib, json, sys; print(hashlib.sha256(json.load(sys.stdin)[0]["SecretData"].encode()).hexdigest())'
    executable: /bin/bash
  loop: "{{ web_secret_exists.results | selectattr('rc', 'defined') | selectattr('rc', 'eq', 0) | list }}"
  register: web_secret_hashes
  check_mode: false
  changed_when: false
  no_log: true
  become: true
  become_user: "{{ web_container_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[web_container_user][1] }}"
  when: ansible_facts.getent_passwd.get(web_container_user) is not none

- name: Predict each secret write
  ansible.builtin.debug:
    msg: "Would write {{ item }}"
  loop: "{{ web_secrets | list }}"
  changed_when: true
  when:
    - ansible_check_mode
    - ansible_facts.getent_passwd.get(web_container_user) is not none
    - web_secret_stored.get(item) != (web_secrets[item] | hash('sha256'))

- name: Write each missing or differing secret
  ansible.builtin.command:
    argv: [podman, secret, create, --replace, "{{ item }}", "-"]
    stdin: "{{ web_secrets[item] }}"
    stdin_add_newline: false
  loop: "{{ web_secrets | list }}"
  register: web_secret_writes
  changed_when: true
  no_log: true
  become: true
  become_user: "{{ web_container_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[web_container_user][1] }}"
  when:
    - not ansible_check_mode
    - ansible_facts.getent_passwd.get(web_container_user) is not none
    - web_secret_stored.get(item) != (web_secrets[item] | hash('sha256'))

- name: Record which secrets were written
  ansible.builtin.set_fact:
    web_secrets_written: "{{ web_secret_writes.results | selectattr('changed') | map(attribute='item') | list }}"
  when: ansible_facts.getent_passwd.get(web_container_user) is not none

- name: Install the Python cryptography library
  ansible.builtin.package:
    name: python3-cryptography
    state: present
  become: true
  when: ansible_facts.getent_passwd.get(web_container_user) is not none

- name: Read the origin certificate
  community.crypto.x509_certificate_info:
    content: "{{ web_origin_certificate }}"
  register: web_origin_certificate_info
  no_log: true
  when: ansible_facts.getent_passwd.get(web_container_user) is not none

- name: Read the origin key
  community.crypto.openssl_privatekey_info:
    content: "{{ web_origin_key }}"
  register: web_origin_key_info
  no_log: true
  when: ansible_facts.getent_passwd.get(web_container_user) is not none

- name: Require the key to belong to the certificate
  ansible.builtin.assert:
    that: web_origin_certificate_info.public_key == web_origin_key_info.public_key
    quiet: true
    fail_msg: "web: web_origin_key doesn't belong to web_origin_certificate; nothing was written"
  when: ansible_facts.getent_passwd.get(web_container_user) is not none

- name: Set the unprivileged port boundary
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: "80"
    sysctl_file: /etc/sysctl.d/99-podman-ports.conf
    sysctl_set: true
    state: present
  become: true
  when: ansible_facts.getent_passwd.get(web_container_user) is not none

- name: Open the listed firewall services
  ansible.posix.firewalld:
    service: "{{ item }}"
    zone: public
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ web_firewall_services }}"
  become: true
  when: ansible_facts.getent_passwd.get(web_container_user) is not none

- name: Make the origin certificate folder
  ansible.builtin.file:
    path: /srv/keepbreathing/deploy/certs
    state: directory
    owner: "{{ web_container_user }}"
    group: "{{ web_container_user }}"
    mode: "0750"
  become: true
  when:
    - ansible_facts.getent_passwd.get(web_container_user) is not none
    - not ansible_check_mode or web_checkout_git.results[0].stat.exists

- name: Write the origin certificate and key
  ansible.builtin.copy:
    dest: "/srv/keepbreathing/deploy/certs/{{ item }}"
    content: "{{ {'origin.pem': web_origin_certificate, 'origin.key': web_origin_key}[item] }}"
    owner: "{{ web_container_user }}"
    group: "{{ web_container_user }}"
    mode: "{{ {'origin.pem': '0644', 'origin.key': '0600'}[item] }}"
  loop:
    - origin.pem
    - origin.key
  register: web_origin_written
  no_log: true
  become: true
  when:
    - ansible_facts.getent_passwd.get(web_container_user) is not none
    - not ansible_check_mode or web_checkout_git.results[0].stat.exists

- name: Install deploy-site from the site checkout
  ansible.builtin.copy:
    src: /srv/keepbreathing/deploy/deploy-site.sh
    dest: /usr/local/bin/deploy-site
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  become: true
  when:
    - ansible_facts.getent_passwd.get(web_container_user) is not none
    - not ansible_check_mode or web_checkout_git.results[0].stat.exists

- name: Make the root-owned key folder
  ansible.builtin.file:
    path: /etc/ssh/authorized_keys
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when:
    - ansible_facts.getent_passwd.get(web_container_user) is not none
    - web_deploy_key != ''

- name: Write the deploy key
  ansible.builtin.copy:
    dest: "/etc/ssh/authorized_keys/{{ web_container_user }}"
    content: "{{ web_deploy_key }}\n"
    owner: root
    group: root
    mode: "0644"
  become: true
  when:
    - ansible_facts.getent_passwd.get(web_container_user) is not none
    - web_deploy_key != ''
