---
# Bootstrap step 8. The host firewall: installed, running, and starting at boot.
# No ports here on purpose. Which ports are open is what makes one machine different
# from another, so ports belong to the per-machine roles (decision #17).
# Firewalld tasks set permanent and immediate together rather than notifying a reload
# handler (decision #19).
#
# HAZARD, on a machine that routes for something else. firewalld flushes and rebuilds the
# packet filter when it STARTS, not only when it reloads, and that discards the rules
# tailscaled has written. On an ordinary tailnet client the connection survives and only
# forwarding breaks. On a subnet router it takes out the route it is carrying — for
# almaserv that is the whole 192.168.4.0/22 house network, over a connection that itself
# runs on that network, so the run cannot recover itself. Recovery is `tailscale down`
# then `tailscale up` at the VirtualBox console, not over the network. almaserv is
# deliberately not in the inventory until that is arranged.
#
# control is subject to the same hazard and IS in the inventory: it advertises
# 10.128.0.0/20, which is the only route to web and mail. The run itself survives, because
# the laptop reaches control as an ordinary tailnet client, but the route would stop
# forwarding with nothing in the output saying so. What makes this survivable rather than
# urgent is that `state: started` is a no-op where firewalld is already running, and it is
# running on every machine in the inventory today. The hazard fires on a machine where it
# is stopped — or not installed at all, because the task above installs it and a fresh
# install is inactive, so the start below is what first builds its ruleset.

- name: firewalld | Ensure firewalld is installed
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: firewalld | Ensure firewalld is running and enabled
  ansible.builtin.systemd_service:
    name: firewalld
    state: started
    enabled: true

- name: firewalld | Remove cockpit service from the default zone
  ansible.posix.firewalld:
    service: cockpit
    zone: public
    state: disabled
    immediate: true
    permanent: true
  when: baseline_firewalld_remove_cockpit
