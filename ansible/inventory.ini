# Ansible runs from the laptop (decision #15; it moves to the control plane when the
# tailnet policy gains a tag-to-tag SSH rule and OpenBao holds the sudo passwords).
#
# Two access paths, by design. hub, vaultserv and control are on the tailnet and are
# reached at their tailnet addresses. web and mail are NOT on the tailnet and are reached
# only through the jump server, which is the control plane at its public address, matching
# the ProxyJump entries in ~/.ssh/config. Their ansible_ssh_common_args carries that.
#
# control also advertises 10.128.0.0/20 as a subnet router, so the laptop has a route to
# the VPC addresses directly. That route is not the sanctioned path and the inventory does
# not use it: going through the jump server keeps every administrative connection to web
# and mail auditable in one place.
#
# Unverified: whether web and mail accept keepbreath0 with the laptop's key through the
# jump. Testing it carelessly is what triggered the bastion's fail2ban jail on 2026-09-19.
# Rehearse with --check --diff against one --limit host.

[webservers]
web ansible_host=10.128.0.3

[mailservers]
mail ansible_host=10.128.0.4

[controlplane]
control ansible_host=100.91.226.31

[monitoring]
hub ansible_host=100.95.89.6

[passwordvault]
vaultserv ansible_host=100.65.221.62


[droplets:children]
webservers
mailservers
controlplane

[vms:children]
monitoring
passwordvault


[all:vars]
ansible_user=keepbreath0
