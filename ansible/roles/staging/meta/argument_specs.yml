---
argument_specs:
  main:
    short_description: Generate staging values and certificates
    options:
      staging_container_user:
        type: str
        required: true
      staging_mailpit_image:
        type: str
        default: docker.io/axllent/mailpit@sha256:5040a9c533087d25dcb8f2ac748f45c9be5f7bc1d9fe5b860afb9597a2471d57
  tunnel:
    short_description: Run staging's Cloudflare tunnel
    options:
      staging_tunnel_token:
        type: str
        required: true
        no_log: true
      staging_cloudflared_image:
        type: str
        default: docker.io/cloudflare/cloudflared@sha256:28b1b51bc44446fafe254b37cd12b024f417a4e48a4b3c136620c2b93cdb0064
