---
# Read the sudo password once per host. group_vars/all.yml defines it as a lookup that
# runs bw every time the value is read, and Ansible reads it on every task; a fact set
# here outranks group_vars, so the rest of the run uses the stored value.
- name: Fetch the become password
  hosts: all
  gather_facts: false
  become: false
  tasks:
    - name: Check the vault is unlocked on the controller
      ansible.builtin.command: bw unlock --check
      delegate_to: localhost
      changed_when: false
      check_mode: false
      vars:
        ansible_become_password: ""
      when: ansible_become | default(true) | bool

    - name: Store the become password as a fact
      ansible.builtin.set_fact:
        ansible_become_password: "{{ ansible_become_password }}"
      no_log: true
      when: ansible_become | default(true) | bool
