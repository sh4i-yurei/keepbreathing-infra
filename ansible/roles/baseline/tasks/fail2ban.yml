---
# EPEL is the community package repo for RHEL
# fail2ban isn't in AlmaLinux's repositories

- name: fail2ban | Install epel
  ansible.builtin.dnf:
    name: epel-release
    state: present

- name: fail2ban | Install fail2ban
  ansible.builtin.dnf:
    name: fail2ban
    state: present

- name: fail2ban | Install the sshd jail
  ansible.builtin.copy:
    src: fail2ban-sshd.conf
    dest: /etc/fail2ban/jail.d/sshd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload fail2ban

- name: fail2ban | Enable service
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started
