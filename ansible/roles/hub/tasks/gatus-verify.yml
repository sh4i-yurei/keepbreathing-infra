---
# Monitoring and alerting step 1. Checks Gatus is in the state the role claims, after it has
# been started. Skipped in check mode, where nothing was written or started.

- name: gatus-verify | Only on a real run
  when: not ansible_check_mode

  block:
    - name: gatus-verify | Wait for Gatus to report itself up
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ hub_gatus_port }}/health"
        return_content: true
      register: hub_gatus_health
      until: hub_gatus_health.status == 200 and ((hub_gatus_health.content | default('', true) or '{}') | from_json).status | default('') == 'UP'
      retries: 10
      delay: 2

    - name: gatus-verify | Read the running Gatus container
      containers.podman.podman_container_info:
        name: gatus
      become: true
      become_user: "{{ hub_container_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ hub_container_account.uid }}"
      register: hub_gatus_container

    - name: gatus-verify | The Gatus container is running the pinned image
      ansible.builtin.assert:
        that:
          - hub_gatus_container.containers | length == 1
          - hub_gatus_container.containers[0].State.Running
          - hub_gatus_container.containers[0].ImageName == hub_gatus_image
        fail_msg: >-
          The gatus container is missing, stopped, or running an image other than the pinned
          {{ hub_gatus_image }}. Running:
          {{ (hub_gatus_container.containers | first | default({})).ImageName | default('nothing') }}.
        quiet: true

    - name: gatus-verify | The password vault check is loaded and passing
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ hub_gatus_port }}/api/v1/endpoints/statuses"
        return_content: true
      register: hub_gatus_statuses
      until: >-
        hub_gatus_statuses.status == 200
        and (hub_gatus_statuses.json | selectattr('key', 'equalto', 'vault_password-vault')
        | map(attribute='results') | first | default([], true)
        | map(attribute='success') | list | last | default(false, true))
      retries: 15
      delay: 10

    - name: gatus-verify | Each GitHub check is loaded and passing
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ hub_gatus_port }}/api/v1/endpoints/statuses"
        return_content: true
      register: hub_gatus_github_statuses
      until: >-
        hub_gatus_github_statuses.status == 200
        and (hub_gatus_github_statuses.json | selectattr('key', 'equalto', item)
        | map(attribute='results') | first | default([], true)
        | map(attribute='success') | list | last | default(false, true))
      retries: 15
      delay: 10
      loop:
        - github_last-deploy
        - github_deploy-queue
        - github_runner

    - name: gatus-verify | Each new health, certificate and domain check is loaded and passing
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ hub_gatus_port }}/api/v1/endpoints/statuses"
        return_content: true
      register: hub_gatus_added_statuses
      until: >-
        hub_gatus_added_statuses.status == 200
        and (hub_gatus_added_statuses.json | selectattr('key', 'equalto', item)
        | map(attribute='results') | first | default([], true)
        | map(attribute='success') | list | last | default(false, true))
      retries: 15
      delay: 10
      loop:
        - hub_ntfy
        - hub_grafana
        - site_www
        - site_domain-expiration

    # The OpenBao check must be loaded but need not pass: hub.yml applies this role before the
    # openbao role, so on a fresh hub OpenBao isn't running yet, and the openbao role's own verify
    # proves it healthy. Gatus lists a check only after its first result, so this waits for one.
    - name: gatus-verify | The OpenBao check is loaded
      block:
        - name: gatus-verify | Wait for Gatus to list the OpenBao check
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ hub_gatus_port }}/api/v1/endpoints/statuses"
            return_content: true
          register: hub_gatus_openbao_statuses
          until: >-
            hub_gatus_openbao_statuses.status == 200
            and (hub_gatus_openbao_statuses.json | selectattr('key', 'equalto', 'hub_openbao')
            | list | length > 0)
          retries: 15
          delay: 10
      rescue:
        - name: gatus-verify | Report the missing OpenBao check
          ansible.builtin.fail:
            msg: >-
              Gatus must load the openbao health check, but its endpoint statuses list no check
              with key hub_openbao after 15 retries. Listed:
              {{ hub_gatus_openbao_statuses.json | default([], true) | map(attribute='key') | list }}.
