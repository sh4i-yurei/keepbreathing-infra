---
- name: Prove the break-glass role against local services
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  vars:
    b2_api_url: "{{ lookup('ansible.builtin.env', 'TEST_B2_API_URL') }}"
    b2_master_key_id: test-master-id
    b2_master_key: test-master-secret
    b2_buckets:
      - machine: testhost
        name: "{{ lookup('ansible.builtin.env', 'TEST_BUCKET') | default('b2glass-locked', true) }}"
    b2_copy_passwords: >-
      {{ {'testhost': {'b2': lookup('ansible.builtin.env', 'TEST_B2_PASSWORD')}}
         if lookup('ansible.builtin.env', 'TEST_HAS_PASSWORD') != '0' else {} }}
    break_glass_sheet_key_page_size: "{{ lookup('ansible.builtin.env', 'TEST_B2_PAGE_SIZE') | default(100, true) | int }}"
  roles:
    - break_glass_sheet
