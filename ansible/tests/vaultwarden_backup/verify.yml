---
- name: Verify the Vaultwarden backup without applying setup tasks
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  vars:
    restic_image: "{{ lookup('ansible.builtin.env', 'TEST_RESTIC_IMAGE') }}"
    vaultwarden_backup_user: vwtest
    vaultwarden_backup_data_dir: "{{ lookup('ansible.builtin.env', 'TEST_DATA') }}"
    vaultwarden_backup_quadlet: /home/vwtest/.config/containers/systemd/vaultwarden.container
    vaultwarden_backup_container: vaultwarden
    vaultwarden_backup_repository: rest:http://127.0.0.1:8082/vwbackup/
    vaultwarden_backup_login: vwbackup
    vaultwarden_backup_password: "{{ lookup('ansible.builtin.env', 'TEST_PASSWORD') }}"
    vaultwarden_backup_restic_password: "{{ lookup('ansible.builtin.env', 'TEST_RESTIC_PASSWORD') }}"
  tasks:
    - name: Run verification
      ansible.builtin.import_role:
        name: vaultwarden_backup
        tasks_from: verify
