---
# Create, replace or remake one Podman secret holding an OpenBao path, without ever reading its
# value (OpenBao on the hub decisions 62 and 72). podman secret inspect without --showsecret
# never runs the driver's lookup, so every read here stays inside Podman and the account's home.
# The including role restarts its unit when openbao_client_secret_changed is true, because a
# running container keeps its old value until it restarts.
- name: OpenBao client | Require a Podman secret name
  ansible.builtin.assert:
    that: openbao_client_secret_name is regex('^[a-z][a-z0-9-]*$', match_type='fullmatch')
    fail_msg: openbao_client_secret_name must match ^[a-z][a-z0-9-]*$
    quiet: true

- name: OpenBao client | Require an OpenBao path
  ansible.builtin.assert:
    that: openbao_client_secret_path is regex('^[a-z][a-z0-9-]*/[a-z][a-z0-9-]*$', match_type='fullmatch')
    fail_msg: openbao_client_secret_path must be <consumer>/<name>, each matching ^[a-z][a-z0-9-]*$
    quiet: true

- name: OpenBao client | Read the Podman account
  ansible.builtin.getent:
    database: passwd

- name: OpenBao client | Find the Podman account in the password database
  ansible.builtin.set_fact:
    openbao_client_podman_entry: "{{ ansible_facts.getent_passwd[openbao_client_podman_account] | default(none) }}"

- name: OpenBao client | Require the Podman account
  ansible.builtin.assert:
    that: openbao_client_podman_entry is not none
    fail_msg: "openbao_client_podman_account {{ openbao_client_podman_account }} must exist"
    quiet: true
  when: not ansible_check_mode

- name: OpenBao client | Predict the Podman secret
  ansible.builtin.debug:
    msg: "openbao_client would create the Podman secret {{ openbao_client_secret_name }} for {{ openbao_client_podman_account }}"
  changed_when: true
  when: openbao_client_podman_entry is none

- name: OpenBao client | Report the predicted secret as changed
  ansible.builtin.set_fact:
    openbao_client_secret_changed: true
  when: openbao_client_podman_entry is none

- name: OpenBao client | Manage the Podman secret
  when: openbao_client_podman_entry is not none
  vars:
    openbao_client_podman_uid: "{{ openbao_client_podman_entry[1] }}"
    openbao_client_podman_home: "{{ openbao_client_podman_entry[4] }}"
    # The shell driver and its four commands, exactly as podman-account's drop-in sets them.
    openbao_client_secret_options:
      delete: /usr/local/bin/openbao-podman-secret delete
      list: /usr/local/bin/openbao-podman-secret list
      lookup: /usr/local/bin/openbao-podman-secret lookup
      store: /usr/local/bin/openbao-podman-secret store
  block:
    - name: OpenBao client | Ask whether the Podman secret exists
      ansible.builtin.command:
        argv: [podman, secret, exists, "{{ openbao_client_secret_name }}"]
      become: true
      become_user: "{{ openbao_client_podman_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ openbao_client_podman_uid }}"
      register: openbao_client_secret_exists
      changed_when: false
      failed_when: openbao_client_secret_exists.rc not in [0, 1]
      check_mode: false

    - name: OpenBao client | Inspect the Podman secret without its value
      ansible.builtin.command:
        argv: [podman, secret, inspect, "{{ openbao_client_secret_name }}"]
      become: true
      become_user: "{{ openbao_client_podman_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ openbao_client_podman_uid }}"
      register: openbao_client_secret_inspect
      changed_when: false
      check_mode: false
      when: openbao_client_secret_exists.rc == 0

    - name: OpenBao client | Work out whether the Podman secret has the right driver
      ansible.builtin.set_fact:
        openbao_client_secret_present: "{{ openbao_client_secret_exists.rc == 0 }}"
        openbao_client_secret_found: >-
          {{ (openbao_client_secret_inspect.stdout | from_json)[0] if openbao_client_secret_exists.rc == 0 else {} }}

    - name: OpenBao client | Note whether the Podman secret has the right driver
      ansible.builtin.set_fact:
        openbao_client_secret_right: >-
          {{ openbao_client_secret_present and
             openbao_client_secret_found.Spec.Driver.Name | default('') == 'shell' and
             openbao_client_secret_found.Spec.Driver.Options | default({}) == openbao_client_secret_options }}

    - name: OpenBao client | Read the secret's mapping file metadata
      ansible.builtin.stat:
        path: "{{ openbao_client_podman_home }}/.config/openbao/podman-secrets/{{ openbao_client_secret_found.ID }}"
      become: true
      become_user: "{{ openbao_client_podman_account }}"
      register: openbao_client_secret_mapping
      when: openbao_client_secret_right

    - name: OpenBao client | Read the secret's stored path
      ansible.builtin.slurp:
        src: "{{ openbao_client_secret_mapping.stat.path }}"
      become: true
      become_user: "{{ openbao_client_podman_account }}"
      register: openbao_client_secret_stored
      when: openbao_client_secret_right and openbao_client_secret_mapping.stat.exists

    - name: OpenBao client | Decide what the Podman secret needs
      ansible.builtin.set_fact:
        openbao_client_secret_remove: "{{ openbao_client_secret_present and not openbao_client_secret_right }}"
        openbao_client_secret_create: "{{ not openbao_client_secret_right }}"
        openbao_client_secret_replace: >-
          {{ openbao_client_secret_right and
             (not openbao_client_secret_mapping.stat.exists or
              (openbao_client_secret_stored.content | b64decode) != openbao_client_secret_path) }}

    # podman secret rm deletes through the driver the secret recorded when it was made, so a
    # secret made with the file driver leaves nothing behind in the file driver's data.
    - name: OpenBao client | Remove the Podman secret made with another driver
      ansible.builtin.command:
        argv: [podman, secret, rm, "{{ openbao_client_secret_name }}"]
      become: true
      become_user: "{{ openbao_client_podman_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ openbao_client_podman_uid }}"
      changed_when: true
      when: openbao_client_secret_remove and not ansible_check_mode

    - name: OpenBao client | Predict removing the Podman secret made with another driver
      ansible.builtin.debug:
        msg: "openbao_client would remove the Podman secret {{ openbao_client_secret_name }} for {{ openbao_client_podman_account }}, made with another driver"
      changed_when: true
      when: openbao_client_secret_remove and ansible_check_mode

    # The path goes on standard input with no newline, because openbao-podman-secret store refuses
    # anything but <consumer>/<name>.
    - name: OpenBao client | Create the Podman secret
      ansible.builtin.command:
        argv: [podman, secret, create, "{{ openbao_client_secret_name }}", "-"]
        stdin: "{{ openbao_client_secret_path }}"
        stdin_add_newline: false
      become: true
      become_user: "{{ openbao_client_podman_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ openbao_client_podman_uid }}"
      changed_when: true
      when: openbao_client_secret_create and not ansible_check_mode

    - name: OpenBao client | Predict creating the Podman secret
      ansible.builtin.debug:
        msg: "openbao_client would create the Podman secret {{ openbao_client_secret_name }} for {{ openbao_client_podman_account }}"
      changed_when: true
      when: openbao_client_secret_create and ansible_check_mode

    # --replace gives the secret a new ID, so its mapping file is written afresh.
    - name: OpenBao client | Replace the Podman secret's path
      ansible.builtin.command:
        argv: [podman, secret, create, --replace, "{{ openbao_client_secret_name }}", "-"]
        stdin: "{{ openbao_client_secret_path }}"
        stdin_add_newline: false
      become: true
      become_user: "{{ openbao_client_podman_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ openbao_client_podman_uid }}"
      changed_when: true
      when: openbao_client_secret_replace and not ansible_check_mode

    - name: OpenBao client | Predict replacing the Podman secret's path
      ansible.builtin.debug:
        msg: "openbao_client would replace the path in the Podman secret {{ openbao_client_secret_name }} for {{ openbao_client_podman_account }}"
      changed_when: true
      when: openbao_client_secret_replace and ansible_check_mode

    - name: OpenBao client | Report whether the Podman secret changed
      ansible.builtin.set_fact:
        openbao_client_secret_changed: >-
          {{ openbao_client_secret_remove or openbao_client_secret_create or openbao_client_secret_replace }}
