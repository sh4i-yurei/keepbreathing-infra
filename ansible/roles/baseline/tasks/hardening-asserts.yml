---
# Hardening assertions for the baseline role
# SELinux enforcing and every repository checking package signatures
# Switching SELinux from permissive to enforcing can break a machine,
# and turning gpgcheck back on hides that it was ever off.

- name: hardening-asserts | SELinux is enforcing now and after the next boot
  ansible.builtin.assert:
    that:
      - ansible_facts['selinux']['mode'] == 'enforcing'
      - ansible_facts['selinux']['config_mode'] == 'enforcing'
    fail_msg: >-
      SELinux is {{ ansible_facts['selinux']['mode'] }} now and set to
      {{ ansible_facts['selinux']['config_mode'] }} in /etc/selinux/config. The role
      does not switch it to enforcing: files written while permissive can carry the
      wrong labels, so enforcing can break the machine until it is relabelled and
      rebooted, and if it is permissive because someone is debugging, flipping it back
      mid-session is hostile. Look at why it was changed (decision #39).
    quiet: true

- name: hardening-asserts | Read each repository's effective signature-check setting
  ansible.builtin.script:
    cmd: "{{ role_path }}/files/repo-gpgcheck-check.py"
    executable: /usr/bin/python3
  register: baseline_gpgcheck_off
  changed_when: false
  failed_when: baseline_gpgcheck_off.rc not in [0, 1, 2]
  check_mode: false

- name: hardening-asserts | Every repository checks package signatures
  ansible.builtin.assert:
    that: baseline_gpgcheck_off.rc == 0
    fail_msg: >-
      The effective repository check reported: {{ baseline_gpgcheck_off.stdout_lines }}.
      Packages from a listed repository install without their signature being verified.
      The role does not turn checking back on, because that would break installs from
      that repository and hide that it was ever off; somebody turned it off on purpose
      (decision #39).
    quiet: true
