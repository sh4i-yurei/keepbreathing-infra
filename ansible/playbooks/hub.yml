---
# Build the hub: its container account, then the generic build, then its services. The
# account has to exist before baseline runs, because baseline checks the account rather
# than creating it (Notification service decision #13).
# Targets hub only; --limit is optional for a single hub but recommended for rehearsal.
#   ansible-playbook playbooks/hub.yml --limit hub

# Open the droplet SSH connections before hub work; ControlPersist=30m keeps them open for later tasks.
- name: Open droplet SSH connections
  hosts: hub
  gather_facts: false
  tasks:
    - name: Ping each droplet before hub work
      ansible.builtin.ping:
      delegate_to: "{{ item }}"
      loop: "{{ groups['droplets'] }}"
      become: false

- name: Fetch the become password
  hosts: hub
  gather_facts: false
  become: false
  roles: [become_password]

- name: Hub container account
  hosts: hub
  tasks:
    - name: Create the hub's container account
      ansible.builtin.import_role:
        name: hub
        tasks_from: account

- name: Baseline
  hosts: hub
  force_handlers: true
  roles:
    - baseline

- name: Access
  hosts: hub
  force_handlers: true
  roles:
    - access

# The services play runs its roles before its tasks, and a roles: entry ignores tasks_from, so
# everything from ticket_band's account part on is imported as tasks. openbao_config needs the
# band's account to exist, and the band's service part needs openbao_config's AppRole files, so
# the band is split around it (OpenBao on the hub decisions 55, 72 and 75).
- name: Hub services
  hosts: hub
  force_handlers: true
  roles:
    - node_exporter
    - hub
    - backup_server
    - openbao
    - openbao_client
  tasks:
    - name: Prepare the ticket band's account for OpenBao
      ansible.builtin.import_role:
        name: ticket_band
        tasks_from: account
    - name: Manage what's inside OpenBao
      ansible.builtin.import_role:
        name: openbao_config
    - name: Run the ticket band's service part
      ansible.builtin.import_role:
        name: ticket_band
    - name: Serve the backup server on the tailnet
      ansible.builtin.import_role:
        name: tailscale_service
      vars:
        tailscale_service_name: backup
        tailscale_service_port: "{{ backup_server_port }}"
    - name: Serve OpenBao on the tailnet
      ansible.builtin.import_role:
        name: tailscale_service
      vars:
        tailscale_service_name: openbao
        tailscale_service_port: "{{ openbao_port }}"
    # OpenBao must be served before its Gatus check can provide a certificate reading (decision 81).
    - name: Verify Gatus's ticket readings
      ansible.builtin.import_role:
        name: hub
        tasks_from: gatus-readings-verify
    - name: Back up OpenBao's snapshot nightly
      ansible.builtin.import_role:
        name: openbao_backup
      tags: [openbao_backup]
