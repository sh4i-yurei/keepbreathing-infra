---
- name: Apply openbao_config without the ansible password
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    openbao_port: 8200
    openbao_self_address: "192.0.2.10"
    openbao_approles: []
    openbao_approle_bound_cidrs: ["192.0.2.10/32", "2001:db8::10/128"]
  roles:
    - openbao_config
