---
# The backup disk's stable path, read on the hub on 2026-10-28 (Backups decision 27).
hub_backup_disk_device: /dev/disk/by-id/ata-VBOX_HARDDISK_VBfb6f4c8a-8d73d857
hub_backup_mount_point: /srv/backup
backup_server_mount_point: "{{ hub_backup_mount_point }}"
backup_server_user: keepbreath6
openbao_user: keepbreath7
openbao_port: 8200
openbao_self_address: "100.95.89.6"
openbao_seal_key_id: hub-1
openbao_seal_key: "{{ lookup('vault_secret', 'openbao seal (hub)') }}"
openbao_keepbreath0_password: "{{ lookup('vault_secret', 'openbao keepbreath0 (hub)') }}"
openbao_ansible_password: "{{ lookup('vault_secret', 'openbao ansible (hub)') }}"
b2_master_key_id: "{{ lookup('vault_secret', 'Backblaze master key', login='username') }}"
b2_master_key: "{{ lookup('vault_secret', 'Backblaze master key') }}"
b2_credentials_user: "{{ backup_server_user }}"
b2_buckets:
  - machine: vaultserv
    name: keepbreathing-vaultserv-backup
b2_copy_user: "{{ backup_server_user }}"
b2_copy_repository_root: "{{ backup_server_mount_point }}/restic"
b2_copy_passwords:
  vaultserv:
    hub: "{{ lookup('vault_secret', 'rclone vaultserv (hub)', field='restic') }}"
    b2: "{{ lookup('vault_secret', 'rclone vaultserv (hub)', field='b2_restic') }}"
backup_server_port: 8082
backup_server_logins:
  - name: verify
    bcrypt: "{{ lookup('vault_secret', 'rclone verify (hub)', field='bcrypt') }}"
  - name: vaultserv
    bcrypt: "{{ lookup('vault_secret', 'rclone vaultserv (hub)', field='bcrypt') }}"
backup_server_verify_password: "{{ lookup('vault_secret', 'rclone verify (hub)') }}"
backup_server_verify_restic_password: "{{ lookup('vault_secret', 'rclone verify (hub)', field='restic') }}"

# The account the hub's containers run under (Notification service decision #12). The hub
# role creates it; baseline sets it up for rootless Podman.
hub_container_user: keepbreath5
baseline_container_user: "{{ hub_container_user }}"
