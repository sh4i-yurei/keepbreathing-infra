---
- name: Reload hub pull user manager
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ hub_pull_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ hub_pull_uid.stdout }}"
  when: not ansible_check_mode

- name: Reload hub pull system manager
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode
