---
# Bootstrap step 9. Podman for rootless containers, on every machine.
# net.ipv4.ip_unprivileged_port_start is not set here (decision #22). It lets every
# unprivileged account on the machine bind ports 80 to 1023, so it is set by the role
# for machines that serve those ports.

- name: podman | Ensure podman is installed
  ansible.builtin.dnf:
    name: podman
    state: present

# Two halves of one mechanism, and both are needed. Quadlet orders every rootless
# container behind a helper that waits for network-online.target and gives up after ninety
# seconds. Something has to pull the target into the boot sequence, which is the symlink,
# and something has to make it actually reach active, which is the wait-online service.
# With only the symlink the target is wanted and never activates, and every container
# starts ninety seconds late with nothing looking wrong.
#
# The trade: boot now waits on the network where it previously did not. nm-online has a
# 30 second timeout, so a machine with a configured interface that never gets carrier
# stalls for that long on every boot. Ninety seconds of late containers is worse. Both
# machines in the inventory already have this service enabled by the NetworkManager
# preset, so the task is a no-op today; it exists so a machine where someone disabled it
# does not silently lose the fix.

- name: podman | Make network-online.target active at boot
  ansible.builtin.file:
    state: link
    src: /usr/lib/systemd/system/network-online.target
    dest: /etc/systemd/system/multi-user.target.wants/network-online.target

- name: podman | Enable the service that makes network-online.target reach active
  ansible.builtin.systemd_service:
    name: NetworkManager-wait-online.service
    enabled: true

- name: podman | Look for the container account's subordinate ID ranges
  ansible.builtin.command: grep -q "^{{ baseline_container_user }}:" {{ item }}
  register: baseline_subids
  changed_when: false
  failed_when: false
  check_mode: false
  loop:
    - /etc/subuid
    - /etc/subgid
  when: baseline_container_user | default('', true) | length > 0

- name: podman | Check the container account has subordinate ID ranges
  ansible.builtin.assert:
    that: baseline_subids.results | selectattr('rc', 'ne', 0) | list | length == 0
    fail_msg: >-
      {{ baseline_container_user }} has no entry in /etc/subuid or /etc/subgid.
      Rootless Podman maps container users onto host IDs with those ranges and
      cannot run without them. useradd allocates them; an account made with
      useradd -r, or one from an identity provider, does not get them.
  when: baseline_container_user | default('', true) | length > 0

- name: podman | Set lingering for the container account
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ baseline_container_user | quote }}
    creates: /var/lib/systemd/linger/{{ baseline_container_user }}
  when: baseline_container_user | default('', true) | length > 0
