---
# Handlers run once, after the tasks that notify them, in the order they are defined here.
# The reload comes first so systemd has reread a changed unit before node_exporter restarts.

- name: Reload systemd for node_exporter
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

- name: Restart node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter.service
    state: restarted
  become: true

- name: Run node_exporter reboot-required check
  ansible.builtin.systemd_service:
    name: node-exporter-reboot-required.service
    state: started
  become: true
  when: not ansible_check_mode

- name: Restart node_exporter reboot-required timer
  ansible.builtin.systemd_service:
    name: node-exporter-reboot-required.timer
    state: restarted
  become: true
  when: not ansible_check_mode
