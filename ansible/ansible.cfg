# Runs on the control plane, from this directory.
[defaults]
inventory = inventory.ini
roles_path = roles
interpreter_python = auto_silent
host_key_checking = True
retry_files_enabled = False

[privilege_escalation]
# Production boxes escalate with a password (Control plane decision #8). Packer builds
# set become=false and connect as root instead; see roles/baseline/defaults.
become = True
become_ask_pass = True
