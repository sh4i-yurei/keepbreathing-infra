---
# Build the hub: its container account, then the generic build, then its services. The
# account has to exist before baseline runs, because baseline checks the account rather
# than creating it (Notification service decision #13).
# Targets hub only; --limit is optional for a single hub but recommended for rehearsal.
#   ansible-playbook playbooks/hub.yml --limit hub

# Open the droplet SSH connections before hub work; ControlPersist=30m keeps them open for later tasks.
- name: Open droplet SSH connections
  hosts: hub
  gather_facts: false
  tasks:
    - name: Ping each droplet before hub work
      ansible.builtin.ping:
      delegate_to: "{{ item }}"
      loop: "{{ groups['droplets'] }}"
      become: false

- name: Fetch the become password
  hosts: hub
  gather_facts: false
  become: false
  roles: [become_password]

- name: Hub container account
  hosts: hub
  tasks:
    - name: Create the hub's container account
      ansible.builtin.import_role:
        name: hub
        tasks_from: account

- name: Baseline
  hosts: hub
  force_handlers: true
  roles:
    - baseline

- name: Access
  hosts: hub
  force_handlers: true
  roles:
    - access

- name: Hub services
  hosts: hub
  force_handlers: true
  roles:
    - node_exporter
    - hub
    - backup_server
    - openbao
    - role: tailscale_service
      tailscale_service_name: backup
      tailscale_service_port: "{{ backup_server_port }}"
    - role: tailscale_service
      tailscale_service_name: openbao
      tailscale_service_port: "{{ openbao_port }}"
