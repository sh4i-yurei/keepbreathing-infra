---
# Notification service step 3. ntfy as a rootless Quadlet container under the hub's
# container account. Files are written as root and owned by that account (Ansible decision
# #50); only the systemd and Podman tasks run as the account itself.

- name: ntfy | Create the folders ntfy and its Quadlet file live in
  ansible.builtin.file:
    path: "/home/{{ hub_container_user }}/{{ item }}"
    state: directory
    owner: "{{ hub_container_user }}"
    group: "{{ hub_container_user }}"
    mode: "0700"
  loop:
    - .config
    - .config/containers
    - .config/containers/systemd
    - .config/ntfy
    - ntfy

- name: ntfy | Write ntfy's configuration file
  ansible.builtin.template:
    src: ntfy-server.yml.j2
    dest: "/home/{{ hub_container_user }}/.config/ntfy/server.yml"
    owner: "{{ hub_container_user }}"
    group: "{{ hub_container_user }}"
    mode: "0600"
  diff: false
  no_log: true
  notify: Restart ntfy

- name: ntfy | Write ntfy's Quadlet file
  ansible.builtin.template:
    src: ntfy.container.j2
    dest: "/home/{{ hub_container_user }}/.config/containers/systemd/ntfy.container"
    owner: "{{ hub_container_user }}"
    group: "{{ hub_container_user }}"
    mode: "0644"
  notify:
    - Reload systemd for the container account
    - Restart ntfy

- name: ntfy | Download ntfy's image into the container account's storage
  containers.podman.podman_image:
    name: "{{ hub_ntfy_image }}"
  become: true
  become_user: "{{ hub_container_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ hub_container_account.uid }}"

- name: ntfy | Run the handlers before making sure ntfy is running
  ansible.builtin.meta: flush_handlers

- name: ntfy | Make sure ntfy is running
  ansible.builtin.systemd_service:
    name: ntfy.service
    state: started
    scope: user
  become: true
  become_user: "{{ hub_container_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ hub_container_account.uid }}"
