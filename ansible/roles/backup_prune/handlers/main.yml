---
- name: Reload backup prune user manager
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ backup_prune_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ backup_prune_uid.stdout }}"
  when: not ansible_check_mode

- name: Reload backup prune system manager
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode
