---
# True when this run is baking an image rather than configuring a live machine. An image
# carries no secrets, ever, so anything secret-applying is skipped during a bake and
# applied by the delta run on the live box (decisions #6 and #32). Nothing in this role
# applies a secret yet, so nothing reads this; the access role will.
baseline_image_build: false

# The admin account. Empty means the machine has none, which is the case for an image and
# for an ephemeral staging box (decision #32). How Ansible logs in is a separate question
# and lives in the inventory, not here.
baseline_admin_user: keepbreath0

# Swap file size. 1G is enough to get dnf through EPEL's metadata on a 1 GB droplet.
baseline_swap_size: 1G

# Take cockpit out of the firewall's default zone. Cockpit is Red Hat's web admin panel on
# port 9090; nothing here runs it, and the stock zone permits it whether it is installed or
# not. It is socket-activated, so if cockpit is ever installed on a box whose baseline
# removed this rule, it will run but be unreachable with nothing obviously wrong. Set this
# to false on a machine that is meant to serve cockpit.
baseline_firewalld_remove_cockpit: true

# these are disk formats the AlmaLinux 9 and 10 kernels do not include; the file is
# written so the oscap scan reports clean and to cover a kernel that does ship them;
# udf and squashfs are left loadable because the VMs mount ISO images
baseline_blacklist_fs_modules:
  - cramfs
  - freevxfs
  - jffs2
  - hfs
  - hfsplus
