---
- name: Reload B2 copy user manager
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ b2_copy_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ b2_copy_uid.stdout }}"
  when: not ansible_check_mode

- name: Reload B2 copy system manager
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode
