- name: Reload systemd for journal pullers
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
  when: not ansible_check_mode

- name: Restart journal pullers
  ansible.builtin.systemd_service:
    name: "journal-pull@{{ item.name }}.service"
    state: restarted
  loop: "{{ hub_journal_sources }}"
  become: true
  when: not ansible_check_mode

- name: Restart Loki data size timer
  ansible.builtin.systemd_service:
    name: loki-data-size.timer
    state: restarted
  become: true
  when: not ansible_check_mode
