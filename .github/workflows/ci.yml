# Runs the repository checks on every pull request and every branch push.
# The job names are what the ruleset on main requires by name, so renaming a job means
# updating the ruleset in the same change.
name: CI

on:
  pull_request:
  push: {}

permissions:
  contents: read

jobs:
  break-glass-sheet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r ../requirements.txt
      - run: ansible-galaxy collection install -r collections/requirements.yml
      - run: sudo apt-get update && sudo apt-get install -y podman apache2-utils xfsprogs skopeo
      - name: Check shared inventory values and pinned restic tag
        run: |
          ansible-inventory --host hub | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["b2_api_url"] == "https://api.backblazeb2.com/b2api/v4/"; assert data["restic_image_tag"] == "docker.io/restic/restic:0.19.1"'
          ! grep -r b2_api_url roles/*/defaults
          skopeo inspect docker://docker.io/restic/restic:0.19.1 | python3 -c 'import json,sys,yaml; digest=json.load(sys.stdin)["Digest"]; pinned=yaml.safe_load(open("group_vars/all.yml"))["restic_image"].split("@",1)[1]; assert digest == pinned, (digest,pinned)'
      - name: Existing container survives driver refusal
        run: |
          sudo podman run -d --name b2glass-weed --network host docker.io/chrislusf/seaweedfs@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59 mini
          before=$(sudo sha256sum /etc/hosts | cut -d' ' -f1)
          if sudo env "PATH=$PATH" "ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections" bash tests/break_glass_sheet/run.sh > container-refusal.log 2>&1; then
            echo 'ASSERTION FAILED: driver accepted existing container'; exit 1
          fi
          grep -Fx 'ASSERTION FAILED: b2glass-weed container already exists' container-refusal.log
          sudo podman container exists b2glass-weed
          test "$before" = "$(sudo sha256sum /etc/hosts | cut -d' ' -f1)"
          sudo podman rm -f b2glass-weed
      - name: Existing hosts entry survives driver refusal
        run: |
          sudo cp -p /etc/hosts hosts-before
          printf '127.0.0.1 s3.us-east-1.seaweedfs.test\n' | sudo tee -a /etc/hosts
          if sudo env "PATH=$PATH" "ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections" bash tests/break_glass_sheet/run.sh > hosts-refusal.log 2>&1; then
            echo 'ASSERTION FAILED: driver accepted existing hosts entry'; exit 1
          fi
          grep -Fx 'ASSERTION FAILED: s3.us-east-1.seaweedfs.test is already in /etc/hosts' hosts-refusal.log
          grep -Fx '127.0.0.1 s3.us-east-1.seaweedfs.test' /etc/hosts
          sudo cp -p hosts-before /etc/hosts
          sudo cmp hosts-before /etc/hosts
      - name: Break-glass role integration cases and cleanup
        shell: bash
        run: |
          before=$(sudo sha256sum /etc/hosts | cut -d' ' -f1)
          sudo env "PATH=$PATH" "ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections" bash tests/break_glass_sheet/run.sh | tee driver.log
          grep -Fx 'break-glass-sheet driver: all cases passed' driver.log
          test "$(grep -c '^PASS ' driver.log)" -eq 7
          ! sudo podman container exists b2glass-weed
          ! sudo find /tmp -maxdepth 1 -name 'ansible.*break-glass-sheet' | grep -q .
          test "$before" = "$(sudo sha256sum /etc/hosts | cut -d' ' -f1)"
          ! grep -E '^CLEANUP FAILED:' driver.log

  b2-copy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r ../requirements.txt
      - run: ansible-galaxy collection install -r collections/requirements.yml
      - run: sudo apt-get update && sudo apt-get install -y podman apache2-utils xfsprogs
      - name: Seed system manager XDG setting for restoration checks
        run: sudo systemctl set-environment "XDG_RUNTIME_DIR=/run/user/$(id -u)"
      - name: Refuse existing B2 copy test resources
        run: |
          sudo useradd -m bstest
          if sudo env "PATH=$PATH" "ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections" bash tests/b2_copy/run.sh > /tmp/b2-copy-existing-account.log 2>&1; then
            echo 'ASSERTION FAILED: driver accepted bstest'; exit 1
          fi
          grep -Fx 'ASSERTION FAILED: bstest already exists' /tmp/b2-copy-existing-account.log
          id bstest
          test -d /home/bstest
          sudo userdel -r bstest
          sudo touch /etc/systemd/system/b2-copy@.timer
          if sudo env "PATH=$PATH" "ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections" bash tests/b2_copy/run.sh > /tmp/b2-copy-existing-unit.log 2>&1; then
            echo 'ASSERTION FAILED: driver accepted unit'; exit 1
          fi
          grep -Fx 'ASSERTION FAILED: b2-copy units already exist' /tmp/b2-copy-existing-unit.log
          test -e /etc/systemd/system/b2-copy@.timer
          ! id bstest
          sudo rm /etc/systemd/system/b2-copy@.timer
          sudo cp -p /etc/hosts /tmp/b2-copy-hosts
          printf '127.0.0.1 s3.us-east-1.seaweedfs.test\n' | sudo tee -a /etc/hosts
          if sudo env "PATH=$PATH" "ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections" bash tests/b2_copy/run.sh > /tmp/b2-copy-existing-host.log 2>&1; then
            echo 'ASSERTION FAILED: driver accepted hosts entry'; exit 1
          fi
          grep -Fx 'ASSERTION FAILED: s3.us-east-1.seaweedfs.test is already in /etc/hosts' /tmp/b2-copy-existing-host.log
          grep -Fx '127.0.0.1 s3.us-east-1.seaweedfs.test' /etc/hosts
          sudo cp -p /tmp/b2-copy-hosts /etc/hosts
          sudo cmp /tmp/b2-copy-hosts /etc/hosts
      - name: Failure after role cleans up all test resources
        run: |
          hosts_before=$(sudo sha256sum /etc/hosts | cut -d' ' -f1)
          environment_before=$(sudo sha256sum /etc/environment | cut -d' ' -f1)
          manager_before=$(systemctl show-environment)
          if sudo env "PATH=$PATH" "ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections" TEST_FAIL_AFTER_COPY_ROLE=1 bash tests/b2_copy/run.sh > /tmp/b2-copy-failure.log 2>&1; then
            echo 'ASSERTION FAILED: driver accepted deliberate failure'; exit 1
          fi
          grep -F 'ASSERTION FAILED: b2_copy role play must pass' /tmp/b2-copy-failure.log || { tail -35 /tmp/b2-copy-failure.log; exit 1; }
          grep -F 'Deliberate failure after B2 copy' /tmp/b2-copy-failure.log || { tail -35 /tmp/b2-copy-failure.log; exit 1; }
          python3 - /tmp/b2-copy-failure.log <<'PY'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text().splitlines()
          first = lines.index('PASS first role run copies snapshot and starts timer')
          failure = next(i for i, line in enumerate(lines) if 'Deliberate failure after B2 copy' in line)
          assert first < failure, 'deliberate failure must follow the first real role run'
          PY
          ! grep -E '^CLEANUP FAILED:' /tmp/b2-copy-failure.log
          test ! -e /etc/systemd/system/b2-copy@.timer
          test ! -e /etc/systemd/system/b2-copy@.service
          test -z "$(systemctl list-units --all --no-legend 'b2-copy*')"
          ! id bstest
          ! sudo losetup --list | grep -F backup.img
          ! sudo podman container exists b2-copy-weed
          test "$hosts_before" = "$(sudo sha256sum /etc/hosts | cut -d' ' -f1)"
          test "$environment_before" = "$(sudo sha256sum /etc/environment | cut -d' ' -f1)"
          test "$manager_before" = "$(systemctl show-environment)"
      - name: B2 copy role integration cases and cleanup
        run: |
          hosts_before=$(sudo sha256sum /etc/hosts | cut -d' ' -f1)
          environment_before=$(sudo sha256sum /etc/environment | cut -d' ' -f1)
          manager_before=$(systemctl show-environment)
          sudo env "PATH=$PATH" "ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections" bash tests/b2_copy/run.sh
          test ! -e /etc/systemd/system/b2-copy@.timer
          test ! -e /etc/systemd/system/b2-copy@.service
          test -z "$(systemctl list-units --all --no-legend 'b2-copy*')"
          ! id bstest
          ! sudo losetup --list | grep -F backup.img
          ! sudo podman container exists b2-copy-weed
          test "$hosts_before" = "$(sudo sha256sum /etc/hosts | cut -d' ' -f1)"
          test "$environment_before" = "$(sudo sha256sum /etc/environment | cut -d' ' -f1)"
          test "$manager_before" = "$(systemctl show-environment)"

  vaultwarden-backup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r ../requirements.txt
      - run: ansible-galaxy collection install -r collections/requirements.yml
      - run: sudo apt-get update && sudo apt-get install -y podman apache2-utils xfsprogs
      - name: Seed system manager XDG setting for restoration checks
        run: sudo systemctl set-environment "XDG_RUNTIME_DIR=/run/user/$(id -u)"
      - name: Existing Vaultwarden test accounts survive driver refusal
        run: |
          for account in bstest vwtest; do
            sudo useradd -m "$account"
            if sudo env "PATH=$PATH" "ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections" bash tests/vaultwarden_backup/run.sh > "/tmp/$account-existing.log" 2>&1; then
              echo "Vaultwarden driver accepted existing $account"
              exit 1
            fi
            grep -Fx "ASSERTION FAILED: $account already exists" "/tmp/$account-existing.log" || { echo "ASSERTION FAILED: $account refusal message missing"; exit 1; }
            id "$account" || { echo "ASSERTION FAILED: $account account removed"; exit 1; }
            test -d "/home/$account" || { echo "ASSERTION FAILED: $account home removed"; exit 1; }
            sudo userdel -r "$account"
          done
          for unit in vaultwarden-backup.timer vaultwarden-backup.service; do
            sudo touch "/etc/systemd/system/$unit"
            if sudo env "PATH=$PATH" "ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections" bash tests/vaultwarden_backup/run.sh > "/tmp/$unit-existing.log" 2>&1; then
              echo "ASSERTION FAILED: Vaultwarden driver accepted existing $unit"; exit 1
            fi
            grep -Fx 'ASSERTION FAILED: vaultwarden-backup units already exist' "/tmp/$unit-existing.log" || { echo "ASSERTION FAILED: $unit refusal message missing"; exit 1; }
            test -e "/etc/systemd/system/$unit" || { echo "ASSERTION FAILED: $unit was removed"; exit 1; }
            ! id bstest && ! id vwtest || { echo "ASSERTION FAILED: $unit refusal created an account"; exit 1; }
            sudo rm "/etc/systemd/system/$unit"
          done
      - name: Backup server failure leaves no driver state
        run: |
          before_file=$(sudo sha256sum /etc/environment | cut -d' ' -f1)
          before_manager=$(systemctl show-environment)
          if sudo env "PATH=$PATH" "ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections" TEST_FAIL_AFTER_BACKUP_SERVER=1 bash tests/vaultwarden_backup/run.sh > /tmp/vw-server-failure.log 2>&1; then
            echo 'ASSERTION FAILED: backup server failure was accepted'; exit 1
          fi
          grep -F 'ASSERTION FAILED: backup server role must pass' /tmp/vw-server-failure.log || { tail -30 /tmp/vw-server-failure.log; exit 1; }
          if id bstest; then echo 'ASSERTION FAILED: bstest survived cleanup'; exit 1; fi
          test ! -e /home/bstest || { echo 'ASSERTION FAILED: bstest home survived cleanup'; exit 1; }
          test ! -e /var/lib/systemd/linger/bstest || { echo 'ASSERTION FAILED: bstest lingering survived cleanup'; exit 1; }
          ! sudo losetup --list | grep -F 'backup.img' || { echo 'ASSERTION FAILED: loop device survived cleanup'; exit 1; }
          test "$before_file" = "$(sudo sha256sum /etc/environment | cut -d' ' -f1)" || { echo 'ASSERTION FAILED: /etc/environment changed'; exit 1; }
          test "$before_manager" = "$(systemctl show-environment)" || { echo 'ASSERTION FAILED: system manager environment changed'; exit 1; }
      - name: Busy mount reports cleanup failure and restores environment
        run: |
          before_file=$(sudo sha256sum /etc/environment | cut -d' ' -f1)
          before_manager=$(systemctl show-environment)
          sudo bash -c 'for ((n=0; n<600; n++)); do point=$(findmnt -rn -t xfs -o TARGET | grep -E "/tmp/tmp[^/]*/backup$" | head -1); if [[ -n $point ]]; then cd "$point"; printf "%s\n" "$point" > /tmp/vw-held-mount; echo "$BASHPID" > /tmp/vw-held-mount.pid; exec sleep 600; fi; sleep 0.1; done' &
          if sudo env "PATH=$PATH" "ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections" TEST_FAIL_AFTER_BACKUP_SERVER=1 bash tests/vaultwarden_backup/run.sh > /tmp/vw-busy-mount.log 2>&1; then
            echo 'ASSERTION FAILED: busy mount run was accepted'; exit 1
          fi
          test -s /tmp/vw-held-mount || { echo 'ASSERTION FAILED: mount holder never entered mount'; tail -30 /tmp/vw-busy-mount.log; exit 1; }
          test "$(sudo readlink "/proc/$(cat /tmp/vw-held-mount.pid)/cwd")" = "$(cat /tmp/vw-held-mount)" || { echo 'ASSERTION FAILED: mount holder left mount before driver exit'; exit 1; }
          grep -E '^CLEANUP FAILED:.*unmount' /tmp/vw-busy-mount.log || { tail -30 /tmp/vw-busy-mount.log; exit 1; }
          if id bstest; then echo 'ASSERTION FAILED: bstest survived busy mount cleanup'; exit 1; fi
          test "$before_file" = "$(sudo sha256sum /etc/environment | cut -d' ' -f1)" || { echo 'ASSERTION FAILED: /etc/environment changed'; exit 1; }
          test "$before_manager" = "$(systemctl show-environment)" || { echo 'ASSERTION FAILED: system manager environment changed'; exit 1; }
          sudo kill "$(cat /tmp/vw-held-mount.pid)"
          sudo umount "$(cat /tmp/vw-held-mount)"
      - name: Failed image pull removes Vaultwarden system units
        run: |
          before_file=$(sudo sha256sum /etc/environment | cut -d' ' -f1)
          before_manager=$(systemctl show-environment)
          if sudo env "PATH=$PATH" "ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections" TEST_FAIL_AT_IMAGE_PULL=1 bash tests/vaultwarden_backup/run.sh > /tmp/vw-image-pull-failure.log 2>&1; then
            echo 'ASSERTION FAILED: failed image pull was accepted'; exit 1
          fi
          grep -F 'TASK [vaultwarden_backup : Vaultwarden backup | Pull the pinned restic image]' /tmp/vw-image-pull-failure.log || { echo 'ASSERTION FAILED: image pull task was not reached'; tail -30 /tmp/vw-image-pull-failure.log; exit 1; }
          grep -F 'ASSERTION FAILED: Vaultwarden backup role play must pass' /tmp/vw-image-pull-failure.log || { echo 'ASSERTION FAILED: image pull failure was not reported'; tail -30 /tmp/vw-image-pull-failure.log; exit 1; }
          ! grep -E '^CLEANUP FAILED:' /tmp/vw-image-pull-failure.log || { echo 'ASSERTION FAILED: image pull cleanup failed'; exit 1; }
          test ! -e /etc/systemd/system/vaultwarden-backup.timer || { echo 'ASSERTION FAILED: Vaultwarden timer file survived image pull cleanup'; exit 1; }
          test ! -e /etc/systemd/system/vaultwarden-backup.service || { echo 'ASSERTION FAILED: Vaultwarden service file survived image pull cleanup'; exit 1; }
          test -z "$(systemctl list-units --all --no-legend 'vaultwarden-backup*')" || { echo 'ASSERTION FAILED: Vaultwarden units remain loaded after image pull failure'; exit 1; }
          ! id vwtest && ! id bstest || { echo 'ASSERTION FAILED: test account survived image pull cleanup'; exit 1; }
          test "$before_file" = "$(sudo sha256sum /etc/environment | cut -d' ' -f1)" || { echo 'ASSERTION FAILED: /etc/environment changed'; exit 1; }
          test "$before_manager" = "$(systemctl show-environment)" || { echo 'ASSERTION FAILED: system manager environment changed'; exit 1; }
      - name: Vaultwarden driver restores the runner environment
        run: |
          before_file=$(sudo sha256sum /etc/environment | cut -d' ' -f1)
          before_manager=$(systemctl show-environment)
          echo "$before_manager" | grep -E '^XDG_RUNTIME_DIR=' || { echo 'ASSERTION FAILED: system manager lacks XDG_RUNTIME_DIR'; exit 1; }
          sudo env "PATH=$PATH" "ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections" bash tests/vaultwarden_backup/run.sh
          after_file=$(sudo sha256sum /etc/environment | cut -d' ' -f1)
          after_manager=$(systemctl show-environment)
          test "$before_file" = "$after_file" || { echo 'ASSERTION FAILED: /etc/environment changed'; exit 1; }
          test "$before_manager" = "$after_manager" || { echo 'ASSERTION FAILED: system manager environment changed'; exit 1; }
          test ! -e /etc/systemd/system/vaultwarden-backup.timer || { echo 'ASSERTION FAILED: Vaultwarden timer file survived cleanup'; exit 1; }
          test ! -e /etc/systemd/system/vaultwarden-backup.service || { echo 'ASSERTION FAILED: Vaultwarden service file survived cleanup'; exit 1; }
          test -z "$(systemctl list-units --all --no-legend 'vaultwarden-backup*')" || { echo 'ASSERTION FAILED: Vaultwarden units remain loaded'; exit 1; }

  b2-bucket:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r ../requirements.txt
      - run: ansible-galaxy collection install -r collections/requirements.yml
      - run: sudo apt-get update && sudo apt-get install -y podman apache2-utils xfsprogs
      - name: Existing B2 test account survives driver refusal
        run: |
          sudo useradd -m b2test
          if sudo env "PATH=$PATH" "ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections" bash tests/b2_bucket/run.sh > /tmp/b2-existing-account.log 2>&1; then
            echo 'B2 driver accepted an existing account'
            exit 1
          fi
          grep -F 'b2test already exists' /tmp/b2-existing-account.log
          id b2test
          test -d /home/b2test
          sudo userdel -r b2test
      - run: sudo env "PATH=$PATH" "ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections" bash tests/b2_bucket/run.sh

  backup-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r ../requirements.txt
      - run: ansible-galaxy collection install -r collections/requirements.yml
      - run: sudo apt-get update && sudo apt-get install -y podman apache2-utils xfsprogs
      - run: sudo env "PATH=$PATH" "ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections" bash tests/backup_server/run.sh

  hub-backup-disk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r ../requirements.txt
      - run: ansible-galaxy collection install -r collections/requirements.yml
      - run: sudo apt-get update && sudo apt-get install -y xfsprogs
      - run: sudo env "PATH=$PATH" "ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections" bash tests/hub_backup_disk/run.sh

  python:
    uses: sh4i-yurei/ci-workflows/.github/workflows/python.yml@95383033d70f2b91d79792739806b44e1a9bf754
    with:
      coverage_floor: 100
      caller_workflow: .github/workflows/ci.yml
      caller_job: python
      install_command: sudo apt-get update && sudo apt-get install -y podman && python -m pip install -r requirements.txt pytest==9.1.1 pytest-cov==7.1.0

  ansible-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        # ansible.cfg sets a relative roles path, so the checks only work from ansible/.
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The laptop runs Ansible on 3.14; CI matches it.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r ../requirements.txt
      - run: ansible-galaxy collection install -r collections/requirements.yml
      - run: ansible-lint

  syntax-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r ../requirements.txt
      - run: ansible-galaxy collection install -r collections/requirements.yml
      # Every playbook, so a new one is checked without editing this file. The secrets in
      # group_vars come from bw lookups, which a syntax check never evaluates.
      - run: |
          for playbook in playbooks/*.yml; do
            ansible-playbook --syntax-check "$playbook"
          done
