---
# Installs node_exporter's release binary, checked against the pinned SHA-256, and runs it
# under systemd as its own account (Monitoring and alerting decisions #12, #24 and #25).

- name: Create the account it runs as
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /sbin/nologin
    create_home: false
  become: true

- name: Make the folder the release is kept in
  ansible.builtin.file:
    path: /var/cache/node_exporter
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Download the release and check it against the pinned SHA-256
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/{{ node_exporter_release }}.tar.gz"
    dest: "/var/cache/node_exporter/{{ node_exporter_release }}.tar.gz"
    checksum: "sha256:{{ node_exporter_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Unpack the release
  ansible.builtin.unarchive:
    src: "/var/cache/node_exporter/{{ node_exporter_release }}.tar.gz"
    dest: /var/cache/node_exporter
    remote_src: true
    creates: "/var/cache/node_exporter/{{ node_exporter_release }}/node_exporter"
  become: true

- name: Install the binary
  ansible.builtin.copy:
    src: "/var/cache/node_exporter/{{ node_exporter_release }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  become: true
  notify: Restart node_exporter

- name: Write the systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd for node_exporter
    - Restart node_exporter

- name: Run the handlers before making sure it is running
  ansible.builtin.meta: flush_handlers

- name: Make sure it is running and starts at boot
  ansible.builtin.systemd_service:
    name: node_exporter.service
    state: started
    enabled: true
  become: true

- name: Check it is in the state the role claims
  ansible.builtin.import_tasks: verify.yml
