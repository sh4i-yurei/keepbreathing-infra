---
- name: Reload Vaultwarden backup user manager
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ vaultwarden_backup_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ vaultwarden_backup_uid.stdout }}"
  when: not ansible_check_mode

- name: Reload Vaultwarden backup system manager
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode
