---
# Read the sudo password once per host. group_vars/all.yml defines it as a lookup that
# runs the vault lookup every time the value is read, and Ansible reads it on every task; a fact set
# here outranks group_vars, so the rest of the run uses the stored value.
- name: Fetch the become password
  hosts: all
  gather_facts: false
  become: false
  tasks:
    - name: Check the vault and fetch the become password
      when: ansible_become | default(true) | bool
      block:
        - name: Fetch the become password from the controller vault
          ansible.builtin.set_fact:
            ansible_become_password: "{{ lookup('vault_secret', 'keepbreath0 sudo (' ~ inventory_hostname ~ ')') }}"
          no_log: true
          vars:
            ansible_become_password: ""
      rescue:
        - name: Report the unavailable controller vault item
          ansible.builtin.fail:
            msg: "Vault lookup failed for item {{ ('keepbreath0 sudo (' ~ inventory_hostname ~ ')') | to_json }}; run vu."
          vars:
            ansible_become_password: ""

    - name: Store the become password as a fact
      ansible.builtin.set_fact:
        ansible_become_password: "{{ ansible_become_password }}"
      no_log: true
      when: ansible_become | default(true) | bool
