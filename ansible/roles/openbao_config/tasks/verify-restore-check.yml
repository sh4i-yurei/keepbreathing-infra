---
- name: OpenBao config verify | Read restore-check test secret metadata
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ openbao_port }}/v1/secret/metadata/restore-check/test"
    method: GET
    headers:
      X-Forwarded-For: "{{ openbao_self_address }}"
      X-Vault-Token: "{{ openbao_config_verify_login.json.auth.client_token }}"
    status_code: [200, 404]
    return_content: true
  register: openbao_config_verify_restore_metadata
  changed_when: false
  check_mode: false
  no_log: true

- name: OpenBao config verify | Require a live test secret version
  ansible.builtin.assert:
    that:
      - openbao_config_verify_restore_metadata.status == 200
      - >-
        openbao_config_verify_restore_metadata.json.data.versions[
          openbao_config_verify_restore_metadata.json.data.current_version | string
        ].deletion_time | default('') | length == 0
      - >-
        not openbao_config_verify_restore_metadata.json.data.versions[
          openbao_config_verify_restore_metadata.json.data.current_version | string
        ].destroyed | default(false)
    fail_msg: "restore-check's test secret must exist"
    quiet: true
