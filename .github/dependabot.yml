# Watches the Actions that CI uses. Python packages are left out on purpose: requirements.txt
# sets minimum versions, so CI already installs the newest release on every run.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Use the shared labels so Dependabot never creates its own (Global development workflow decision 30).
    labels: ["dependencies", "type:chore"]
    groups:
      actions:
        patterns: ["*"]
