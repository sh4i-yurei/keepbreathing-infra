---
# Runs Vaultwarden as a rootless container.
baseline_container_user: keepbreath4

# node_exporter listens on the tailnet address, behind a password from this machine's own vault item,
# and only the hub's tailnet address may reach it. The tailnet encrypts the traffic, so it serves
# plain HTTP (Monitoring and alerting decision #30).
node_exporter_listen_address: "100.65.221.62:9100"
node_exporter_allowed_sources:
  - 100.95.89.6
journal_gateway_listen_address: "100.65.221.62:19531"
journal_gateway_allowed_sources: "{{ node_exporter_allowed_sources }}"
# Monitoring and alerting decision 58: AlmaLinux 10 gatewayd cannot check client certificates.
journal_gateway_verify_client: false
node_exporter_basic_auth_password: "{{ lookup('vault_secret', 'node_exporter prometheus (' ~ inventory_hostname ~ ')') }}"
node_exporter_basic_auth_hash: "{{ lookup('vault_secret', 'node_exporter prometheus (' ~ inventory_hostname ~ ')', field='bcrypt') }}"

podman_exporter_enabled: true
podman_exporter_container_user: "{{ baseline_container_user }}"
podman_exporter_listen_address: "100.65.221.62:9882"
podman_exporter_allowed_sources: "{{ node_exporter_allowed_sources }}"
podman_exporter_expected_containers:
  - podman-exporter
  - vaultwarden
podman_exporter_basic_auth_password: "{{ lookup('vault_secret', 'podman_exporter prometheus (' ~ inventory_hostname ~ ')') }}"
podman_exporter_basic_auth_hash: "{{ lookup('vault_secret', 'podman_exporter prometheus (' ~ inventory_hostname ~ ')', field='bcrypt') }}"
