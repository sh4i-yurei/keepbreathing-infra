---
# Backups decision 27. Checks the live backup mount and its persistent fstab entry.
# Skipped in check mode, where no filesystem was mounted.

- name: backup-disk-verify | Only on a real run
  when: not ansible_check_mode

  block:
    - name: backup-disk-verify | Read the mounted device and filesystem at the backup path
      ansible.builtin.command:
        argv:
          - findmnt
          - -n
          - -o
          - SOURCE,FSTYPE
          - --mountpoint
          - "{{ hub_backup_mount_point }}"
      register: hub_backup_live_mount
      changed_when: false
      failed_when: false
      become: true

    - name: backup-disk-verify | Check whether the configured device is mounted at the backup path
      ansible.builtin.command:
        argv:
          - findmnt
          - -n
          - -o
          - SOURCE
          - --source
          - "{{ hub_backup_disk_device }}"
          - --mountpoint
          - "{{ hub_backup_mount_point }}"
      register: hub_backup_live_device
      changed_when: false
      failed_when: false
      become: true

    - name: backup-disk-verify | Read the backup path's fstab entry
      ansible.builtin.command:
        argv:
          - findmnt
          - --fstab
          - -n
          - -o
          - SOURCE,FSTYPE,OPTIONS
          - --mountpoint
          - "{{ hub_backup_mount_point }}"
      register: hub_backup_fstab_entry
      changed_when: false
      failed_when: false
      become: true

    - name: backup-disk-verify | Require a live mount
      ansible.builtin.assert:
        that:
          - hub_backup_live_mount.rc == 0
        fail_msg: "Nothing is mounted at {{ hub_backup_mount_point }}."
        quiet: true

    - name: backup-disk-verify | Require the configured device at the backup path
      ansible.builtin.assert:
        that:
          - hub_backup_live_device.rc == 0
        fail_msg: >-
          {{ hub_backup_mount_point }} has {{ hub_backup_live_fields[0] }} mounted,
          not the backup disk {{ hub_backup_disk_device }}.
        quiet: true
      vars:
        hub_backup_live_fields: "{{ hub_backup_live_mount.stdout.split() }}"

    - name: backup-disk-verify | Require XFS at the backup path
      ansible.builtin.assert:
        that:
          - hub_backup_live_fields[1] == 'xfs'
        fail_msg: "{{ hub_backup_mount_point }} is mounted as {{ hub_backup_live_fields[1] }}, not xfs."
        quiet: true
      vars:
        hub_backup_live_fields: "{{ hub_backup_live_mount.stdout.split() }}"

    - name: backup-disk-verify | Require exactly one persistent entry
      ansible.builtin.assert:
        that:
          - hub_backup_fstab_entry.stdout_lines | length == 1
        fail_msg: >-
          /etc/fstab needs exactly one entry for {{ hub_backup_mount_point }},
          and it has {{ hub_backup_fstab_entry.stdout_lines | length }}.
        quiet: true

    - name: backup-disk-verify | Require the configured device in fstab
      ansible.builtin.assert:
        that:
          - hub_backup_fstab_fields[0] == hub_backup_disk_device
        fail_msg: >-
          The /etc/fstab entry for {{ hub_backup_mount_point }} names
          {{ hub_backup_fstab_fields[0] }}, not the backup disk {{ hub_backup_disk_device }}.
        quiet: true
      vars:
        hub_backup_fstab_fields: "{{ hub_backup_fstab_entry.stdout_lines[0].split() }}"

    - name: backup-disk-verify | Require XFS in fstab
      ansible.builtin.assert:
        that:
          - hub_backup_fstab_fields[1] == 'xfs'
        fail_msg: >-
          The /etc/fstab entry for {{ hub_backup_mount_point }} has type
          {{ hub_backup_fstab_fields[1] }}, not xfs.
        quiet: true
      vars:
        hub_backup_fstab_fields: "{{ hub_backup_fstab_entry.stdout_lines[0].split() }}"

    - name: backup-disk-verify | Require nofail in fstab
      ansible.builtin.assert:
        that:
          - "'nofail' in hub_backup_fstab_fields[2].split(',')"
        fail_msg: "The /etc/fstab entry for {{ hub_backup_mount_point }} is missing nofail."
        quiet: true
      vars:
        hub_backup_fstab_fields: "{{ hub_backup_fstab_entry.stdout_lines[0].split() }}"
