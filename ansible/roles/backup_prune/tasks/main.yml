---
- name: Backup prune | Check account lingering
  ansible.builtin.stat:
    path: "/var/lib/systemd/linger/{{ backup_prune_user }}"
  register: backup_prune_linger

- name: Backup prune | Require account lingering
  ansible.builtin.assert:
    that: backup_prune_linger.stat.exists
    fail_msg: "Account lingering is required; run the backup_server role first."
    quiet: true

- name: Backup prune | Require every machine's inputs before changes
  ansible.builtin.include_tasks: require-one.yml
  loop: "{{ b2_buckets }}"
  loop_control:
    loop_var: backup_prune_target
    label: "{{ backup_prune_target.machine }}"

- name: Backup prune | Read account UID
  ansible.builtin.command:
    argv: [id, -u, "{{ backup_prune_user }}"]
  register: backup_prune_uid
  changed_when: false
  check_mode: false

- name: Backup prune | Check unit paths for rehearsal
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "/home/{{ backup_prune_user }}/.config/systemd/user/backup-prune-run@.service"
    - "/home/{{ backup_prune_user }}/.config/systemd/user/backup-check-run@.service"
    - /etc/systemd/system/backup-prune@.service
    - /etc/systemd/system/backup-prune@.timer
    - /etc/systemd/system/backup-check@.service
    - /etc/systemd/system/backup-check@.timer
  register: backup_prune_unit_plan
  when: ansible_check_mode

- name: Backup prune | Report unit files the rehearsal would write
  ansible.builtin.debug:
    msg: "Would write {{ item.item }}"
  loop: "{{ backup_prune_unit_plan.results }}"
  when:
    - ansible_check_mode
    - not item.stat.exists

- name: Backup prune | Check shared systemd folder
  ansible.builtin.stat:
    path: "/home/{{ backup_prune_user }}/.config/systemd/user"
  register: backup_prune_systemd_folder

- name: Backup prune | Create missing shared systemd folder
  ansible.builtin.file:
    path: "/home/{{ backup_prune_user }}/.config/systemd/user"
    state: directory
    owner: "{{ backup_prune_user }}"
    group: "{{ backup_prune_user }}"
    mode: "0700"
  when: not backup_prune_systemd_folder.stat.exists

- name: Backup prune | Write user units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/home/{{ backup_prune_user }}/.config/systemd/user/{{ item }}"
    owner: "{{ backup_prune_user }}"
    group: "{{ backup_prune_user }}"
    mode: "0644"
  loop:
    - backup-prune-run@.service
    - backup-check-run@.service
  notify: Reload backup prune user manager

- name: Backup prune | Write system units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - backup-prune@.service
    - backup-prune@.timer
    - backup-check@.service
    - backup-check@.timer
  notify: Reload backup prune system manager

- name: Backup prune | Apply manager reloads
  ansible.builtin.meta: flush_handlers

- name: Backup prune | Verify every machine
  ansible.builtin.include_tasks: verify-one.yml
  loop: "{{ b2_buckets }}"
  loop_control:
    loop_var: backup_prune_target
    label: "{{ backup_prune_target.machine }}"
  when: not ansible_check_mode
