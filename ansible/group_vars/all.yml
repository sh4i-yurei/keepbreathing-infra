---
# Sudo password for every persistent box, read from the vault at run time.
# Convention: one Login item per host, named "keepbreath0 sudo (<inventory name>)".
# Lookup is skipped on a host with ansible_become=false (a robot build that is already root)

ansible_become_password: "{{ lookup('vault_secret', 'keepbreath0 sudo (' ~ inventory_hostname ~ ')') if ansible_become | default(true) | bool else ''}}"

# The admin account's password hash, from a hidden field named "hash" on the same vault
# item. Read only by the access role's admin account task.
access_admin_password_hash: "{{ lookup('vault_secret', 'keepbreath0 sudo (' ~ inventory_hostname ~ ')', field='hash') }}"

image_build: false
