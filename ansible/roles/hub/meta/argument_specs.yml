---
argument_specs:
  main:
    short_description: The services that run on the hub
    options:
      hub_container_user:
        type: str
        required: true
        description: The account the hub's containers run under.
      hub_ntfy_image:
        type: str
        default: docker.io/binwiederhier/ntfy@sha256:4c599cf0818965782f93f652bd843e92714992e84d6b88ad17713dc0951cda1f
        description: ntfy's container image, pinned by digest.
      hub_ntfy_port:
        type: int
        default: 8080
        description: The port ntfy is published on, on 127.0.0.1 only.
      hub_ntfy_users:
        type: list
        elements: dict
        description: ntfy's users. Each has a name, a list of topic:access rules, and token
          true for the ones that publish with a token.

      hub_gatus_image:
        type: str
        default: ghcr.io/twin/gatus@sha256:094eb186e55235db367e90e9d56140e5897b7044c41de23cde4cc18e6da1242e
        description: Gatus's container image, pinned by digest.
      hub_gatus_port:
        type: int
        default: 8081
        description: The port Gatus is published on, on 127.0.0.1 only.

  account:
    short_description: Create the account the hub's containers run under
    options:
      hub_container_user:
        type: str
        required: true
        description: The account the hub's containers run under.
