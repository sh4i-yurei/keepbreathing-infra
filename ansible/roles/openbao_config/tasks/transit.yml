---
# transit/ and the keys openbao_transit_keys lists (OpenBao on the hub decision 67). A key
# recreated by name can't read what the old one wrote, so a missing key is made only on a run
# given -e openbao_make_transit_keys=true; any other run warns and goes on. A key that leaves the
# list stays in OpenBao, and nothing here deletes, rotates or reconfigures a key.
- name: OpenBao config | Require transit/ to be a transit secrets engine
  ansible.builtin.assert:
    that: >-
      'transit/' not in openbao_config_mounts.json.data
      or openbao_config_mounts.json.data['transit/'].type == 'transit'
    fail_msg: transit/ must be a transit secrets engine
    quiet: true

- name: OpenBao config | Manage the listed transit keys
  when: openbao_transit_keys | length > 0
  block:
    - name: OpenBao config | Report transit/ in check mode
      ansible.builtin.debug:
        msg: openbao_config would enable transit/
      changed_when: true
      when: ansible_check_mode and 'transit/' not in openbao_config_mounts.json.data

    - name: OpenBao config | Enable transit/
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ openbao_port }}/v1/sys/mounts/transit"
        method: POST
        headers:
          X-Forwarded-For: "{{ openbao_self_address }}"
          X-Vault-Token: "{{ openbao_config_login.json.auth.client_token }}"
        body_format: json
        body:
          type: transit
        status_code: [204]
      register: openbao_config_enable_transit
      changed_when: openbao_config_enable_transit.status == 204
      no_log: true
      when: not ansible_check_mode and 'transit/' not in openbao_config_mounts.json.data

    # The token's policy isn't widened in check mode, so a dry run reads no key while transit/ is
    # absent, as the AppRole cleanup skips approle/.
    - name: OpenBao config | Read each listed transit key
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ openbao_port }}/v1/transit/keys/{{ item }}"
        method: GET
        headers:
          X-Forwarded-For: "{{ openbao_self_address }}"
          X-Vault-Token: "{{ openbao_config_login.json.auth.client_token }}"
        status_code: [200, 404]
        return_content: true
      loop: "{{ openbao_transit_keys }}"
      register: openbao_config_transit_key_reads
      changed_when: false
      check_mode: false
      no_log: true
      when: not ansible_check_mode or 'transit/' in openbao_config_mounts.json.data

    - name: OpenBao config | Set the missing transit keys
      ansible.builtin.set_fact:
        openbao_config_missing_transit_keys: >-
          {{ openbao_config_transit_key_reads.results | selectattr('status', 'defined')
             | selectattr('status', 'equalto', 404) | map(attribute='item') | list }}

    - name: OpenBao config | Report each transit key to make in check mode
      ansible.builtin.debug:
        msg: "openbao_config would make the transit key {{ item }}"
      loop: "{{ openbao_config_missing_transit_keys }}"
      changed_when: true
      when: ansible_check_mode and openbao_make_transit_keys | bool

    - name: OpenBao config | Make each missing transit key
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ openbao_port }}/v1/transit/keys/{{ item }}"
        method: POST
        headers:
          X-Forwarded-For: "{{ openbao_self_address }}"
          X-Vault-Token: "{{ openbao_config_login.json.auth.client_token }}"
        body_format: json
        body:
          type: aes256-gcm96
        status_code: [200]
      loop: "{{ openbao_config_missing_transit_keys }}"
      changed_when: true
      no_log: true
      when: not ansible_check_mode and openbao_make_transit_keys | bool

    - name: OpenBao config | Warn about each missing transit key
      ansible.builtin.debug:
        msg: >-
          openbao_config warning: transit key {{ item }} is missing; restore OpenBao's snapshot (decision 27),
          or make it on purpose with -e openbao_make_transit_keys=true
      loop: "{{ openbao_config_missing_transit_keys }}"
      when: not (openbao_make_transit_keys | bool)
