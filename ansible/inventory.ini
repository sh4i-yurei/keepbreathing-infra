# The three droplets are reached over the VPC from the control plane, which runs
# Ansible against itself locally. The two VMs in the house are reached over the
# tailnet, where Tailscale SSH does the authentication.

[webservers]
web ansible_host=10.128.0.3

[mailservers]
mail ansible_host=10.128.0.4

[controlplane]
control ansible_connection=local

[monitoring]
hub ansible_host=100.95.89.6

[passwordvault]
vaultserv ansible_host=100.65.221.62


[droplets:children]
webservers
mailservers
controlplane

[vms:children]
monitoring
passwordvault


[all:vars]
ansible_user=keepbreath0
