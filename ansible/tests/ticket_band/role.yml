---
- name: Exercise ticket band on localhost
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ticket_band_user: tbtest
  tasks:
    # The account part and then the account's own checks. This job has no OpenBao, no
    # openbao-podman-secret and no passt, so the main tasks, which start the receiver pod, run
    # here only in check mode, from check-mode.yml.
    - name: Prepare the band's account
      ansible.builtin.import_role:
        name: ticket_band
        tasks_from: account
    # verify's commands skip in check mode, and its asserts would then parse empty output.
    - name: Verify the band's account
      ansible.builtin.import_role:
        name: ticket_band
        tasks_from: verify
      when: not ansible_check_mode
