# Managed by Ansible (roles/hub). Edits here are overwritten.
# Grafana loads every dashboard in files/dashboards from this folder (Monitoring and alerting
# decisions #40 and #41). allowUiUpdates: false means changes made in the browser are exported as
# JSON and committed over the file, not saved over it.
apiVersion: 1

providers:
  - name: hub
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
