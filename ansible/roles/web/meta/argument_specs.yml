---
argument_specs:
  main:
    short_description: Prepare the site and contact API checkouts
    options:
      web_container_user:
        type: str
        required: false
        description: The account the site and contact API run under, defaulting to baseline_container_user.
      web_site_ref:
        type: str
        required: true
        description: The commit or branch used when the site checkout is missing.
      web_contact_api_ref:
        type: str
        required: true
        description: The commit or branch used when the contact API checkout is missing.
      web_smtp_host:
        type: str
        required: true
        description: The mail relay name the worker connects to.
      web_smtp_user:
        type: str
        required: true
        description: The relay login.
      web_smtp_port:
        type: int
        required: true
        description: The relay port.
      web_smtp_host_address:
        type: str
        required: false
        default: ""
        description: The address to pin the relay name to inside the worker, or empty for no pin.
      web_redis_password:
        type: str
        required: true
        no_log: true
        description: >-
          The Redis password, stored in kb-redis-conf, kb-rediscli-auth and kb-broker-url. It may hold only
          A-Z, a-z, 0-9 and . _ ~ - because it is embedded in the broker URL.
      web_altcha_hmac_key:
        type: str
        required: true
        no_log: true
        description: The contact API's ALTCHA HMAC key, stored in kb-altcha-key.
      web_smtp_password:
        type: str
        required: true
        no_log: true
        description: The relay password the worker logs in with, stored in kb-smtp-pass.
  account:
    short_description: Create the account the site and the contact API run under
    options:
      web_container_user:
        type: str
        required: false
        description: The account the site and contact API run under, defaulting to baseline_container_user.
