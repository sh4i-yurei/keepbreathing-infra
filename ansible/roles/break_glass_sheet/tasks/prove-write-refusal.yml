---
- name: Break-glass sheet | Name write-refusal failure
  ansible.builtin.set_fact:
    break_glass_sheet_proof_failure: "B2 accepted an upload from the sheet's key for {{ break_glass_sheet_target.name }}"
    break_glass_sheet_proof_tool: ""
  no_log: true

- name: Break-glass sheet | Authorize new key on controller
  ansible.builtin.uri:
    url: "{{ b2_api_url }}b2_authorize_account"
    method: GET
    headers:
      Authorization: "Basic {{ (break_glass_sheet_new_key.json.applicationKeyId ~ ':' ~ break_glass_sheet_new_key.json.applicationKey) | b64encode }}"
    return_content: true
  register: break_glass_sheet_new_auth
  delegate_to: localhost
  become: false
  failed_when: false
  no_log: true

- name: Break-glass sheet | Ask B2 for an upload URL on controller
  ansible.builtin.uri:
    url: "{{ break_glass_sheet_new_auth.json.apiInfo.storageApi.apiUrl }}/b2api/v4/b2_get_upload_url"
    method: POST
    headers:
      Authorization: "{{ break_glass_sheet_new_auth.json.authorizationToken }}"
    body_format: json
    body:
      bucketId: "{{ (break_glass_sheet_bucket_list.json.buckets | selectattr('bucketName', 'equalto', break_glass_sheet_target.name) | first).bucketId }}"
    return_content: true
  register: break_glass_sheet_upload_response
  delegate_to: localhost
  become: false
  failed_when: false
  no_log: true
  when: >-
    break_glass_sheet_new_auth.status | default(0) == 200 and
    break_glass_sheet_new_auth.json.apiInfo.storageApi.apiUrl is defined and
    break_glass_sheet_new_auth.json.authorizationToken is defined

- name: Break-glass sheet | Keep only B2's safe refusal fields
  ansible.builtin.set_fact:
    break_glass_sheet_proof_failure: >-
      {{ break_glass_sheet_proof_failure }}. b2 said: {{
      (['HTTP', (break_glass_sheet_response.status | default('') | string),
        (break_glass_sheet_response.json.code | default('') | string),
        (break_glass_sheet_response.json.message | default('') | string)]
       if break_glass_sheet_response.status is defined
       else ['HTTP', break_glass_sheet_response.msg | default('')])
      | reject('equalto', '') | join(' ') }}
  vars:
    break_glass_sheet_response: >-
      {{ break_glass_sheet_upload_response
         if break_glass_sheet_upload_response is defined and
            not break_glass_sheet_upload_response.skipped | default(false)
         else break_glass_sheet_new_auth }}
  no_log: true

- name: Break-glass sheet | Require B2 to refuse upload permission
  ansible.builtin.assert:
    that:
      - break_glass_sheet_upload_response is defined
      - not break_glass_sheet_upload_response.skipped | default(false)
      - break_glass_sheet_upload_response.status | default(0) == 401
      - break_glass_sheet_upload_response.json.code | default('') == 'unauthorized'
  no_log: true
