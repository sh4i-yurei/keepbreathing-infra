---
# EPEL is the community package repo for RHEL
# fail2ban isn't in AlmaLinux's repositories

- name: fail2ban | Install epel
  ansible.builtin.dnf:
    name: epel-release
    state: present

- name: fail2ban | Install fail2ban
  ansible.builtin.dnf:
    name:
      # python3-systemd is what the jail's `backend = systemd` reads the journal with.
      # It arrives as a weak dependency of fail2ban-server, so an image built with
      # install_weak_deps=False — common on minimal cloud images — gets fail2ban running
      # with no backend and a jail that never loads.
      - fail2ban
      - python3-systemd
    state: present

- name: fail2ban | Install the sshd jail
  ansible.builtin.copy:
    src: fail2ban-sshd.conf
    dest: /etc/fail2ban/jail.d/sshd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload fail2ban

- name: fail2ban | Enable service
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started
