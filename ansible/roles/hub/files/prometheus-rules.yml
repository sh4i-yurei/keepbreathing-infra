# Managed by Ansible (roles/hub). Edits here are overwritten.
# The one cause-based page (Monitoring and alerting decision #5): a filesystem that will run out of
# space within a day. The expression is node_exporter's own NodeFilesystemSpaceFillingUp warning
# rule from its node-mixin, with the mixin's default settings filled in.
groups:
  - name: disk
    rules:
      - alert: NodeFilesystemSpaceFillingUp
        expr: |
          (
            node_filesystem_avail_bytes{job="node",fstype!="",mountpoint!=""}
              / node_filesystem_size_bytes{job="node",fstype!="",mountpoint!=""} * 100 < 40
          and
            predict_linear(node_filesystem_avail_bytes{job="node",fstype!="",mountpoint!=""}[6h], 24*60*60) < 0
          and
            node_filesystem_readonly{job="node",fstype!="",mountpoint!=""} == 0
          )
        for: 1h
        labels:
          severity: page
        annotations:
          summary: Filesystem is predicted to run out of space within the next 24 hours.
          description: >-
            Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint }}, at
            {{ $labels.instance }} has only {{ printf "%.2f" $value }}% available space left and is
            filling up.

  # Every scrape target except the ticket receiver pages when down for 5 minutes (Monitoring and
  # alerting decision #33). The ticket receiver's own alert is TicketDeliveryDown (OpenBao on the
  # hub decision 24).
  - name: targets
    rules:
      - alert: TargetDown
        expr: up{job!="ticket-receiver"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: A scrape target has been down for 5 minutes.
          description: >-
            Prometheus has not been able to scrape {{ $labels.job }} on {{ $labels.instance }} for 5
            minutes.

  # A reboot needed after package updates is a ticket, after it has remained true for an hour
  # (Monitoring and alerting step 16, decision #54).
  - name: reboots
    rules:
      - alert: NodeRebootRequired
        expr: node_reboot_required{job="node"} == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: A machine has needed a reboot for one hour.
          description: >-
            {{ $labels.instance }} needs a reboot to finish applying package updates.

  # The hub's Loki data directory is watched before it reaches 5 GiB (decision #56).
  - name: logs
    rules:
      - alert: LokiDataDirectoryGrowing
        expr: loki_data_directory_size_bytes{job="node",instance="hub"} > 4 * 1024 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Loki's data directory has grown beyond 4 GiB.
          description: >-
            Loki on the hub uses {{ $value }} bytes; the planned review point is 5 GiB.

      - alert: JournalPullGapRecovered
        expr: increase(journal_pull_gaps_total{job="node",instance="hub"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: The hub recovered from a gap in {{ $labels.host }}'s logs.
          description: >-
            The hub missed some logs from {{ $labels.host }} and resumed on its own.
            Nothing needs doing now. If this repeats, the hub may have been down
            too long or {{ $labels.host }} may be flooding its journal.

  # A container on any scraped machine that is not running for 5 minutes pages.
  # 2 is running in podman_container_state.
  - name: containers
    rules:
      - alert: ContainerNotRunning
        expr: podman_container_state{job="podman"} != 2
        for: 5m
        labels:
          severity: page
        annotations:
          summary: A container has not been running for 5 minutes.
          description: >-
            The {{ $labels.name }} container on {{ $labels.instance }} is in state {{ $value }} (2 is running;
            3 stopped, 5 exited).

  # Notices about the ticket band's own health carry band_health="true", which Alertmanager routes
  # straight to ntfy's tickets topic (OpenBao on the hub decisions 24, 41 and 59).
  - name: band-health
    rules:
      - alert: OpenBaoUnhealthy
        expr: gatus_results_endpoint_success{key="hub_openbao"} == 0
        for: 5m
        labels:
          severity: warning
          band_health: "true"
        annotations:
          gatus_key: hub_openbao
          summary: OpenBao has failed its health check for 5 minutes.
          description: >-
            OpenBao on the hub is sealed, down or unreachable through svc:openbao. Services
            can't fetch their secrets from it until it is back.

      - alert: TicketDeliveryDown
        expr: up{job="ticket-receiver"} == 0
        for: 5m
        labels:
          severity: warning
          band_health: "true"
        annotations:
          summary: The ticket receiver has not answered Prometheus for 5 minutes.
          description: >-
            The ticket band's receiver on the hub is stopped, held back at boot or not
            answering through nginx on {{ $labels.instance }}. Alertmanager can't deliver tickets to
            it until it is back.

  # Gatus's GitHub and certificate notices become tickets (OpenBao on the hub decisions 14, 25,
  # 38 and 42).
  - name: gatus-tickets
    rules:
      - alert: GatusDeployFailed
        expr: gatus_results_endpoint_success{key="github_last-deploy"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          gatus_key: github_last-deploy
          summary: The site's last deploy has not succeeded for 5 minutes.
          description: >-
            Gatus has found the latest completed run of keepbreathing's deploy workflow failed,
            or could not read it, for 5 minutes.

      - alert: GatusDeployQueued
        expr: gatus_results_endpoint_success{key="github_deploy-queue"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          gatus_key: github_deploy-queue
          summary: A deploy has sat queued for 10 minutes.
          description: >-
            Gatus has found a queued run of keepbreathing's deploy workflow, or could not read
            the queue, for 10 minutes.

      - alert: GatusRunnerOffline
        expr: gatus_results_endpoint_success{key="github_runner"} == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          gatus_key: github_runner
          summary: GitHub has not seen the deploy runner online for an hour.
          description: >-
            Gatus has found keepbreathing's self-hosted runner offline or unregistered, or could
            not read its status, for an hour.

      - alert: CertificateExpiringSoon
        expr: gatus_results_certificate_expiration_seconds{certificate_ticket="true"} <= 1209600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: The certificate behind Gatus's {{ $labels.name }} check expires within 14 days.
          description: >-
            The certificate Gatus's {{ $labels.group }}/{{ $labels.name }} check sees expires in
            {{ $value | humanizeDuration }}.
