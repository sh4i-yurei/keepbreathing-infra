# Runs the repository checks on every pull request and every branch push.
# The job names are what the ruleset on main requires by name, so renaming a job means
# updating the ruleset in the same change.
name: CI

on:
  pull_request:
  push: {}

permissions:
  contents: read

jobs:
  b2-bucket:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r ../requirements.txt
      - run: ansible-galaxy collection install -r collections/requirements.yml
      - run: sudo apt-get update && sudo apt-get install -y podman apache2-utils xfsprogs
      - run: sudo env "PATH=$PATH" "ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections" bash tests/b2_bucket/run.sh

  backup-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r ../requirements.txt
      - run: ansible-galaxy collection install -r collections/requirements.yml
      - run: sudo apt-get update && sudo apt-get install -y podman apache2-utils xfsprogs
      - run: sudo env "PATH=$PATH" "ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections" bash tests/backup_server/run.sh

  hub-backup-disk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r ../requirements.txt
      - run: ansible-galaxy collection install -r collections/requirements.yml
      - run: sudo apt-get update && sudo apt-get install -y xfsprogs
      - run: sudo env "PATH=$PATH" "ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections" bash tests/hub_backup_disk/run.sh

  python:
    uses: sh4i-yurei/ci-workflows/.github/workflows/python.yml@95383033d70f2b91d79792739806b44e1a9bf754
    with:
      coverage_floor: 100
      caller_workflow: .github/workflows/ci.yml
      caller_job: python
      install_command: sudo apt-get update && sudo apt-get install -y podman && python -m pip install -r requirements.txt pytest==9.1.1 pytest-cov==7.1.0

  ansible-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        # ansible.cfg sets a relative roles path, so the checks only work from ansible/.
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The laptop runs Ansible on 3.14; CI matches it.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r ../requirements.txt
      - run: ansible-galaxy collection install -r collections/requirements.yml
      - run: ansible-lint

  syntax-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r ../requirements.txt
      - run: ansible-galaxy collection install -r collections/requirements.yml
      # Every playbook, so a new one is checked without editing this file. The secrets in
      # group_vars come from bw lookups, which a syntax check never evaluates.
      - run: |
          for playbook in playbooks/*.yml; do
            ansible-playbook --syntax-check "$playbook"
          done
