---
argument_specs:
  main:
    short_description: Manage what's inside OpenBao through its API, as the ansible login
    options:
      openbao_port:
        type: int
        required: true
      openbao_self_address:
        type: str
        required: true
      openbao_ansible_password:
        type: str
        required: true
        no_log: true
      openbao_approles:
        type: list
        elements: dict
        required: true
        options:
          name:
            type: str
            required: true
          account:
            type: str
          files:
            type: bool
            default: true
          extra_paths:
            type: list
            elements: dict
            default: []
            options:
              path:
                type: str
                required: true
              capabilities:
                type: list
                elements: str
                required: true
      openbao_approle_bound_cidrs:
        type: list
        elements: str
        required: true
