---
# Runs the self-hosted GitHub Actions runner. Also the deploy account.
baseline_container_user: keepbreath3

# node_exporter listens on the tailnet address, where the hub's scrapes arrive, and only the hub's
# tailnet address may reach it (decisions #26 and #30).
node_exporter_listen_address: "100.91.226.31:9100"
node_exporter_allowed_sources:
  - 100.95.89.6

journal_gateway_listen_address: "100.91.226.31:19531"
journal_gateway_allowed_sources: "{{ node_exporter_allowed_sources }}"

podman_exporter_enabled: true
podman_exporter_container_user: "{{ baseline_container_user }}"
podman_exporter_listen_address: "100.91.226.31:9882"
podman_exporter_allowed_sources: "{{ node_exporter_allowed_sources }}"
podman_exporter_expected_containers:
  - podman-exporter
  - runner
