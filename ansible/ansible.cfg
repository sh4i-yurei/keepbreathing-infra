# Runs from the laptop, from this directory (decision #15). It moves to the control plane
# when the tailnet policy gains a tag-to-tag SSH rule and OpenBao holds the sudo passwords;
# until then the vault lookup in group_vars/all.yml needs a session that only the laptop
# has. ansible-lint and --syntax-check only work from here, because roles_path is relative.
[defaults]
inventory = inventory.ini
roles_path = roles
interpreter_python = auto_silent
host_key_checking = True
retry_files_enabled = False

[privilege_escalation]
# Production boxes escalate with a password (Control plane decision #8). The password
# comes from the vault per host, via the lookup in group_vars/all.yml.
#
# This sets the default, not the variable. `ansible_become` stays undefined, which is what
# the guards in playbooks/baseline.yml test: an inventory for a root build sets
# ansible_become=false and those guards then skip the vault entirely. Nothing in this
# repository sets that pair for any host yet; see the role README.

become = True

[ssh_connection]
# One approved Tailscale SSH check-mode connection stays open for thirty minutes of idle
# (ControlPersist=30m), so later runs inside that window skip the browser check. Idle
# past it and the next run waits on a new check, which Ansible hides as a hang.
ssh_args = -o ControlMaster=auto -o ControlPersist=30m
