---
argument_specs:
  main:
    short_description: Install node_exporter as a systemd service
    options:
      node_exporter_version:
        type: str
        default: "1.12.1"
        description: The node_exporter release to install, without the leading v.
      node_exporter_sha256:
        type: str
        default: b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63
        description: The SHA-256 of that release's linux-amd64 archive, recorded when the
          version is chosen.
      node_exporter_listen_address:
        type: str
        default: "127.0.0.1:9100"
        description: The address and port node_exporter listens on.
