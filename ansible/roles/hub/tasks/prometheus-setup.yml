---
# Monitoring and alerting step 3. Prometheus as a rootless Quadlet container under the hub's
# container account, the same way as gatus-setup.yml. It reaches node_exporter and Gatus through the
# hub's loopback (decision #24). Files are written as root and owned by that account; only the
# systemd and Podman tasks run as the account itself.

- name: prometheus-setup | Create the folders Prometheus and its Quadlet file live in
  ansible.builtin.file:
    path: "/home/{{ hub_container_user }}/{{ item }}"
    state: directory
    owner: "{{ hub_container_user }}"
    group: "{{ hub_container_user }}"
    mode: "0700"
  loop:
    - .config
    - .config/containers
    - .config/containers/systemd
    - .config/prometheus
    - prometheus

- name: prometheus-setup | Write Prometheus's configuration file
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "/home/{{ hub_container_user }}/.config/prometheus/prometheus.yml"
    owner: "{{ hub_container_user }}"
    group: "{{ hub_container_user }}"
    mode: "0600"
  notify: Restart prometheus

- name: prometheus-setup | Write Prometheus's rules
  ansible.builtin.copy:
    src: prometheus-rules.yml
    dest: "/home/{{ hub_container_user }}/.config/prometheus/rules.yml"
    owner: "{{ hub_container_user }}"
    group: "{{ hub_container_user }}"
    mode: "0600"
  notify: Restart prometheus

- name: prometheus-setup | Write the missing-container rule from the role's Quadlet templates
  ansible.builtin.template:
    src: container-missing-rules.yml.j2
    dest: "/home/{{ hub_container_user }}/.config/prometheus/container-missing-rules.yml"
    owner: "{{ hub_container_user }}"
    group: "{{ hub_container_user }}"
    mode: "0600"
  notify: Restart prometheus

# node_exporter's mixin recording rules, copied unchanged from monitoring.mixins.dev at commit
# 8607c0eb5d9de22d796dd092ee4c9348eec3d6bb (SHA-256 4dce2ad9...). The USE Method / Cluster dashboard
# reads them (Monitoring and alerting decision #40).
- name: prometheus-setup | Write node_exporter's mixin recording rules
  ansible.builtin.copy:
    src: node-mixin-rules.yml
    dest: "/home/{{ hub_container_user }}/.config/prometheus/node-mixin-rules.yml"
    owner: "{{ hub_container_user }}"
    group: "{{ hub_container_user }}"
    mode: "0600"
  notify: Restart prometheus

# The node_exporter, Prometheus and Alertmanager mixins' alert rules, copied unchanged from
# monitoring.mixins.dev at the same commit (decisions #35 and #42). critical goes to pages and warning
# to tickets in Alertmanager's routing.
- name: prometheus-setup | Write the mixins' alert rules
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/home/{{ hub_container_user }}/.config/prometheus/{{ item }}"
    owner: "{{ hub_container_user }}"
    group: "{{ hub_container_user }}"
    mode: "0600"
  loop:
    - node-mixin-alerts.yml
    - prometheus-mixin-alerts.yml
    - alertmanager-mixin-alerts.yml
  notify: Restart prometheus

- name: prometheus-setup | Write Prometheus's password for Alertmanager
  ansible.builtin.template:
    src: prometheus-alertmanager-password.j2
    dest: "/home/{{ hub_container_user }}/.config/prometheus/alertmanager-password"
    owner: "{{ hub_container_user }}"
    group: "{{ hub_container_user }}"
    mode: "0600"
  diff: false
  no_log: true
  notify: Restart prometheus

- name: prometheus-setup | Write Prometheus's password for Grafana
  ansible.builtin.template:
    src: grafana-prometheus-password.j2
    dest: "/home/{{ hub_container_user }}/.config/prometheus/grafana-password"
    owner: "{{ hub_container_user }}"
    group: "{{ hub_container_user }}"
    mode: "0600"
  diff: false
  no_log: true
  notify: Restart prometheus

# The droplets' node_exporter certificates are public and readable without sudo, so they are read
# as the login account. Reading them over SSH from each droplet means Prometheus trusts what is on
# that machine, not whatever answers on the network (decision #29). become is off because
# become-password.yml stores the hub's sudo password as a fact, which outranks the droplet's own.
- name: prometheus-setup | Read each droplet's node_exporter certificate
  ansible.builtin.slurp:
    src: /etc/node_exporter/node_exporter.crt
  delegate_to: "{{ item }}"
  loop: "{{ groups['droplets'] }}"
  become: false
  register: hub_droplet_certificates

- name: prometheus-setup | Write the droplets' certificates into the one file Prometheus trusts
  ansible.builtin.copy:
    content: "{{ hub_droplet_certificates.results | map(attribute='content') | map('b64decode') | join('') }}"
    dest: "/home/{{ hub_container_user }}/.config/prometheus/droplets.crt"
    owner: "{{ hub_container_user }}"
    group: "{{ hub_container_user }}"
    mode: "0600"
  notify: Restart prometheus

- name: prometheus-setup | Write Prometheus's password for each droplet's node_exporter
  ansible.builtin.copy:
    content: "{{ hostvars[item].node_exporter_basic_auth_password }}"
    dest: "/home/{{ hub_container_user }}/.config/prometheus/node-{{ item }}-password"
    owner: "{{ hub_container_user }}"
    group: "{{ hub_container_user }}"
    mode: "0600"
  loop: "{{ groups['droplets'] }}"
  diff: false
  no_log: true
  notify: Restart prometheus

- name: prometheus-setup | Write Prometheus's password for each tailnet machine's node_exporter
  ansible.builtin.copy:
    content: "{{ lookup('vault_secret', 'node_exporter prometheus (' ~ item.name ~ ')') }}"
    dest: "/home/{{ hub_container_user }}/.config/prometheus/node-{{ item.name }}-password"
    owner: "{{ hub_container_user }}"
    group: "{{ hub_container_user }}"
    mode: "0600"
  loop: "{{ hub_node_exporter_tailnet_hosts }}"
  loop_control:
    label: "{{ item.name }}"
  diff: false
  no_log: true
  notify: Restart prometheus

# As with node_exporter, Prometheus trusts the exact self-signed certificates read from the
# droplets themselves. vaultserv uses the tailnet and therefore needs no certificate here.
- name: prometheus-setup | Read each droplet's Podman exporter certificate
  ansible.builtin.slurp:
    src: /etc/podman_exporter/podman_exporter.crt
  delegate_to: "{{ item }}"
  loop: "{{ hub_podman_exporter_droplet_hosts }}"
  become: false
  register: hub_podman_exporter_certificates

- name: prometheus-setup | Write the Podman exporter certificates Prometheus trusts
  ansible.builtin.copy:
    content: >-
      {{ hub_podman_exporter_certificates.results | map(attribute='content')
      | map('b64decode') | join('') }}
    dest: "/home/{{ hub_container_user }}/.config/prometheus/podman-exporters.crt"
    owner: "{{ hub_container_user }}"
    group: "{{ hub_container_user }}"
    mode: "0600"
  notify: Restart prometheus

- name: prometheus-setup | Write each droplet's Podman exporter password
  ansible.builtin.copy:
    content: "{{ hostvars[item].podman_exporter_basic_auth_password }}"
    dest: "/home/{{ hub_container_user }}/.config/prometheus/podman-{{ item }}-password"
    owner: "{{ hub_container_user }}"
    group: "{{ hub_container_user }}"
    mode: "0600"
  loop: "{{ hub_podman_exporter_droplet_hosts }}"
  diff: false
  no_log: true
  notify: Restart prometheus

- name: prometheus-setup | Write each tailnet Podman exporter's password
  ansible.builtin.copy:
    content: "{{ hostvars[item].podman_exporter_basic_auth_password }}"
    dest: "/home/{{ hub_container_user }}/.config/prometheus/podman-{{ item }}-password"
    owner: "{{ hub_container_user }}"
    group: "{{ hub_container_user }}"
    mode: "0600"
  loop: "{{ hub_podman_exporter_tailnet_hosts }}"
  diff: false
  no_log: true
  notify: Restart prometheus

- name: prometheus-setup | Write Prometheus's Quadlet file
  ansible.builtin.template:
    src: prometheus.container.j2
    dest: "/home/{{ hub_container_user }}/.config/containers/systemd/prometheus.container"
    owner: "{{ hub_container_user }}"
    group: "{{ hub_container_user }}"
    mode: "0644"
  notify:
    - Reload systemd for the container account
    - Restart prometheus

- name: prometheus-setup | Download Prometheus's image into the container account's storage
  containers.podman.podman_image:
    name: "{{ hub_prometheus_image }}"
  become: true
  become_user: "{{ hub_container_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ hub_container_account.uid }}"

- name: prometheus-setup | Run the handlers before making sure Prometheus is running
  ansible.builtin.meta: flush_handlers

- name: prometheus-setup | Make sure Prometheus is running
  ansible.builtin.systemd_service:
    name: prometheus.service
    state: started
    scope: user
  become: true
  become_user: "{{ hub_container_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ hub_container_account.uid }}"
