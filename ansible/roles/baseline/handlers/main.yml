---
# Handlers run once at the end of the play, and only when a task that notifies them
# reported a change. Reload rather than restart: existing sessions stay up.

- name: Reload sshd
  ansible.builtin.systemd_service:
    name: sshd
    state: reloaded

- name: Reload fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: reloaded

- name: Restart systemd-journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: Flush the journal to disk
  ansible.builtin.command:
    cmd: journalctl --flush
  changed_when: true

- name: Restart rsyslog
  ansible.builtin.systemd_service:
    name: rsyslog
    state: restarted
